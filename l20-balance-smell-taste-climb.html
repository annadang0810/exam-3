<style>

/* Layout: one narrow column; home = a path from the senses to the pupil, run = card + figure + choices */
:root{
  --bg:#EDF1EE; --panel:#FFFFFF; --panel2:#F6F8F6; --ink:#15201C; --muted:#5A6A64; --line:#CFD9D4;
  --accent:#0C7A63; --accent-ink:#FFFFFF; --cover:#EE8A22; --cover-dim:#B9C4BF; --ok:#1C8A4B; --bad:#C2372C; --star:#D99A0B;
  --c1:#2F6FB7; --c2:#8A5BB0; --c3:#0C7A63; --c4:#C9821A; --c5:#C4467E;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1513; --panel:#16201D; --panel2:#1B2723; --ink:#E3ECE8; --muted:#93A7A0; --line:#2A3A35;
  --accent:#43CF9E; --accent-ink:#06231A; --cover:#F0922E; --cover-dim:#4A5853; --ok:#4FC47D; --bad:#F2695D; --star:#F2B930;
  --c1:#6FA6EA; --c2:#B88BE0; --c3:#43CF9E; --c4:#EAA94A; --c5:#EE7BB0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1513; --panel:#16201D; --panel2:#1B2723; --ink:#E3ECE8; --muted:#93A7A0; --line:#2A3A35;
  --accent:#43CF9E; --accent-ink:#06231A; --cover:#F0922E; --cover-dim:#4A5853; --ok:#4FC47D; --bad:#F2695D; --star:#F2B930;
  --c1:#6FA6EA; --c2:#B88BE0; --c3:#43CF9E; --c4:#EAA94A; --c5:#EE7BB0; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;margin:0}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:18px 48px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.box:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px}
.hero h1{font-size:clamp(30px,7vw,46px);font-weight:800;line-height:1.02;letter-spacing:-.01em;margin-top:6px}
.hero p{color:var(--muted);margin:8px 0 0;max-width:60ch}
.trace{margin:18px 0 6px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 6px 4px;overflow:hidden}
.trace svg{display:block;width:100%;height:auto}
.trace .grid{stroke:var(--line);stroke-width:1}
.trace .curve{fill:none;stroke:var(--accent);stroke-width:3;stroke-linejoin:round}
.trace .dot{cursor:pointer}
.trace .dot circle{fill:var(--panel);stroke:var(--accent);stroke-width:2.5}
.trace .dot.done circle{fill:var(--accent)}
.trace .dot text{font-family:var(--mono);font-size:12px;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.trace .dot.done text{fill:var(--accent-ink)}
.trace .ax{font-family:var(--mono);font-size:10px;fill:var(--muted)}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:16px 0 22px}
.mode{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:2px}
.mode b{font-family:var(--display);font-weight:700;font-size:17px}
.mode span{color:var(--muted);font-size:13px}
.mode:disabled{opacity:.45;cursor:default}
.stages{display:flex;flex-direction:column;gap:8px}
.stage{display:grid;grid-template-columns:64px minmax(0,1fr) auto;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;width:100%}
.stage .mv{font-family:var(--mono);font-size:13px;white-space:nowrap;color:var(--accent);font-variant-numeric:tabular-nums}
.stage h3{font-size:18px;font-weight:700}
.stage small{color:var(--muted);display:block;font-size:13px}
.stars{font-size:16px;letter-spacing:2px;color:var(--line);white-space:nowrap}
.stars i{font-style:normal;color:var(--star)}
.foot{color:var(--muted);font-size:13px;margin-top:22px}
/* run */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px;display:flex;flex-direction:column;gap:8px}
.hudrow{display:flex;align-items:center;gap:10px;justify-content:space-between;font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.mult{color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:8px}
.ctx{background:var(--panel2);border-left:3px solid var(--accent);padding:8px 12px;border-radius:6px;margin-bottom:12px;font-size:15px}
.tag{display:inline-flex;gap:6px;align-items:center;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.tag .tr{color:var(--c2);border:1px solid currentColor;border-radius:4px;padding:0 5px}
.tag .hy{color:var(--bad);border:1px solid currentColor;border-radius:4px;padding:0 5px}
.q{font-size:18px;font-weight:700;margin:2px 0 12px;white-space:pre-line}
.fig{position:relative;width:100%;margin:4px 0 4px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#fff}
.fig img{display:block;width:100%;height:auto}
.box{position:absolute;border-radius:3px;background:var(--cover-dim);border:0;padding:0}
.box.target{background:var(--cover);box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--cover)}
.box.tap{background:var(--cover);cursor:pointer}
.box.tap:hover{filter:brightness(1.08)}
.nomask .box{background:transparent}
.nomask .box.target{background:color-mix(in srgb,var(--cover) 14%,transparent);box-shadow:none;outline:3px solid var(--cover);outline-offset:-3px}
.box.right{background:transparent!important;outline:3px solid var(--ok);outline-offset:-1px;box-shadow:none}
.box.wrong{background:transparent!important;outline:3px solid var(--bad);outline-offset:-1px;box-shadow:none}
.figcap{font-size:12px;color:var(--muted);margin:2px 0 12px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;background:var(--panel2);border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;font-size:16px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--panel))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--panel))}
.opt:disabled{cursor:default}
.sortitem{font-size:18px;font-weight:700;background:var(--panel2);border:1px dashed var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cat{border:2px solid var(--cc);background:color-mix(in srgb,var(--cc) 10%,var(--panel));border-radius:10px;padding:12px 10px;font-weight:700}
.cat.right{outline:3px solid var(--ok);outline-offset:2px}
.cat.wrong{outline:3px solid var(--bad);outline-offset:2px}
.seq{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;min-height:20px}
.seq .slot{font-family:var(--mono);font-size:14px;padding:8px 10px;border-radius:8px;background:color-mix(in srgb,var(--accent) 12%,var(--panel));display:flex;gap:8px}
.seq .slot.wrong{background:color-mix(in srgb,var(--bad) 14%,var(--panel))}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--panel2);border:1.5px solid var(--line);border-radius:999px;padding:8px 13px;font-size:15px}
.chip:disabled{opacity:.3}
.mtgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.mtcol{display:flex;flex-direction:column;gap:8px}
.mtb{text-align:left;background:var(--panel2);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px}
.mtb.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.mtb.paired{opacity:.55}
.mtb.right{border-color:var(--ok)} .mtb.wrong{border-color:var(--bad)}
.fb{margin-top:14px;border-radius:10px;padding:12px 14px;font-size:15px}
.fb.ok{background:color-mix(in srgb,var(--ok) 12%,var(--panel));border:1px solid var(--ok)}
.fb.no{background:color-mix(in srgb,var(--bad) 10%,var(--panel));border:1px solid var(--bad)}
.fb b{display:block;margin-bottom:2px}
.next{margin-top:14px;width:100%;background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:13px;font-weight:700;font-size:17px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.actions .next{flex:1 1 160px;margin-top:0}
.actions .ghostbtn{flex:1 1 160px;background:none;border:1.5px solid var(--line);border-radius:12px;padding:13px;font-weight:700}
.result h2{font-size:30px;margin:6px 0}
.big-stars{font-size:38px;letter-spacing:6px;color:var(--line)} .big-stars i{font-style:normal;color:var(--star)}
.stat{font-family:var(--mono);font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.misslist{margin:12px 0 0;padding-left:18px;font-size:14px;color:var(--muted)}
@media (max-width:440px){.stage{grid-template-columns:54px minmax(0,1fr) auto;gap:10px;padding:12px}.stars{font-size:13px;letter-spacing:1px}.cats{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
const DIA = {};
const STAGES = [];
let _sid = 0;
function STAGE(name, sub, mv, items){ const s = {name, sub, mv, items: items.flat()}; s.items.forEach((it,i)=>{ it.id = 's'+STAGES.length+'_'+i; it.stage = STAGES.length; }); STAGES.push(s); }
function mc(q,o,why,red){ return {t:'mc',q,o,why,hy:!!red}; }
function im(img,q,o,why,red){ return {t:'mc',img,q,o,why,hy:!!red}; }
function so(set,item,key,why,red){ return {t:'so',set,item,key,why,hy:!!red}; }
function od(q,steps,why,red){ return {t:'od',q,steps,why,hy:!!red}; }
function mt(q,pairs,why,red){ return {t:'mt',q,pairs,why,hy:!!red}; }
function lb(dia,name,why,red){ return {t:'lb',dia,name,why,hy:!!red}; }
function nm(dia,name,why,red,q,x){ x=x||{}; return {t:'nm',dia,name,why,hy:!!red,q:q||null,o:x.o||null,ans:x.ans||name,idx:x.idx||0}; }
function cs(text,steps,red,img){ return steps.map(s=>({t:'mc',ctx:text,img:img||null,q:s[0],o:s[1],why:s[2],hy:!!red})); }

</script>
<script>
// ===== Lecture 20 content: Balance, smell and taste =====
function T(x){ (Array.isArray(x)?x:[x]).forEach(i=>i.trap=true); return x; }

const SORTS = {
  org: {label: 'Which inner ear organ detects this?', cats: [['ves','Vestibule (utricle + saccule)','--c3'],['scc','Semicircular canals','--c4'],['coc','Cochlea','--c2']]},
  us: {label: 'Utricle or saccule?', cats: [['utr','Utricle (horizontal plane)','--c1'],['sac','Saccule (vertical plane)','--c5']]},
  ty: {label: 'Type I or Type II vestibular hair cell?', cats: [['t1','Type I (phasic, rapid)','--c2'],['t2','Type II (tonic, slower)','--c4']]},
  bend: {label: 'Stereocilia bent toward or away from the kinocilium?', cats: [['tow','Toward the kinocilium','--c4'],['awy','Away from the kinocilium','--c1']]},
  mc: {label: 'Macula (vestibule) or crista ampullaris (canal)?', cats: [['mac','Macula','--c3'],['cri','Crista ampullaris','--c5']]},
  ts: {label: 'Which primary taste?', cats: [['sw','Sweet','--c4'],['bi','Bitter','--c1'],['sa','Salty','--c2'],['so','Sour','--c3'],['um','Umami','--c5']]},
  vor: {label: 'Head turns RIGHT. What does this eye muscle do?', cats: [['con','Contracts (excited)','--c4'],['rel','Relaxes (inhibited)','--c1']]},
};

/* ---------- Stage 1 ---------- */
STAGE('Balance and the vestibule','3 things balance detects, utricle vs saccule, macula, otoliths, Type I vs II','P1', [
  mc('Balance relies on detecting which three things?',['Head position relative to gravity, linear acceleration, rotational acceleration','Sound frequency, loudness, head position','Linear acceleration, light intensity, rotation','Gravity, blood pressure, eye position'],'Slide 2.',1),
  so('org','Head tilted to one side and held','ves','Head position relative to gravity = vestibule.'),
  so('org','A car suddenly brakes','ves','Linear (horizontal) acceleration = utricle.'),
  so('org','An elevator slows down','ves','Linear (vertical) acceleration = saccule.'),
  so('org','Shaking your head “no”','scc','Rotation (yaw) = semicircular canals.'),
  so('org','A figure skater’s sit spin','scc','⭐ Pure angular acceleration.'),
  so('org','Nodding “yes”','scc','Rotation (pitch).'),
  so('org','A 4000 Hz tone','coc','Hearing, not balance.'),
  so('us','Car suddenly brakes','utr','Horizontal acceleration.'),
  so('us','Elevator slows down','sac','Vertical acceleration.'),
  so('us','Hair cells oriented on a horizontal plane','utr','Slide 3.'),
  so('us','Hair cells oriented on a vertical plane','sac','Slide 3.'),
  so('us','Jumping straight up on a trampoline','sac','Up/down = vertical.'),
  so('us','A train pulling forward out of a station','utr','Forward/back = horizontal.'),
  T(mc('Where is the vestibule?',['Central part of the bony labyrinth, between the cochlea and the semicircular canals','At the end of each semicircular canal','Inside the middle ear, next to the stapes','At the apex of the cochlea'],'Slide 3. The bulge at the end of a canal is the ampulla.',1)),
  T(mc('The two otolith organs are the:',['Utricle and saccule','Ampulla and cupula','Utricle and ampulla','Saccule and cochlea'],'Ampulla and cupula belong to the semicircular canals.',1)),
  T(mc('The utricle detects:',['Horizontal acceleration, because its hair cells lie on a horizontal plane','Vertical acceleration, because its hair cells lie on a horizontal plane','Rotation in the horizontal plane','Vertical acceleration, because its hair cells lie on a vertical plane'],'⭐ One swapped word: horizontal ↔ vertical. Utricle = horizontal, saccule = vertical.',1)),
  T(mc('You ride an elevator that accelerates upward while also sliding sideways (a tilted elevator). What is activated?',['Both the utricle and the saccule; the brain combines them','Only the saccule','Only the utricle','The semicircular canals'],'⭐ Combined movement has horizontal and vertical vectors, so both fire and the brain integrates them.',1)),
  mt('Match each part of the macula to what it is.',[['Stereocilia + kinocilium','Hair bundle (staircase + one tallest)'],['Otolithic membrane','Gelatinous “jello” layer'],['Otoliths','CaCO₃ crystals on top'],['Vestibular nerve','Carries signal to the brain']],'Slide 3 and notes table.',1),
  T(mc('What are otoliths made of?',['Calcium carbonate (CaCO₃) crystals','Calcium phosphate','Gelatinous protein','Keratin'],'“Ear stones.”',1)),
  T(mc('Why are otoliths needed for detecting tilt and linear acceleration?',['They are heavy, so gravity and inertia shift them more than the rest of the structure','They are light, so they float in endolymph','They generate the receptor potential themselves','They release neurotransmitter onto the nerve'],'⭐ Heavy → respond to gravity (tilt) and, with bigger inertia, to acceleration.',1)),
  od('Order the steps of how the macula detects a head tilt.',['Head tilts or accelerates','Heavy otoliths shift','Gelatinous membrane shifts with them','Stereocilia bend','Channels open, neurotransmitter released','Vestibular neurons signal the brain'],'⭐ Notes, 6 steps.',1),
  T(mc('Where are the stereocilia of a macular hair cell embedded?',['In the gelatinous otolithic membrane','Directly in the otoliths','In the cupula','In the tectorial membrane'],'The cupula is the canal version; tectorial is the cochlea.',1)),
  so('ty','Responds only to a CHANGE in stimulus','t1','Phasic.'),
  so('ty','Keeps responding while you hold a tilted position','t2','Tonic.'),
  so('ty','Quickly detects that you suddenly bent down','t1','Her example.'),
  so('ty','Keeps confirming “head is in this position” for minutes','t2','Her example.'),
  T(mc('Type I vestibular hair cells are:',['Rapid and phasic: they respond only to changes in the stimulus','Slow and tonic: they respond as long as the stimulus is present','Rapid and tonic','Slow and phasic'],'⭐ Watch the pairing. Type I = rapid + phasic; Type II = slower + tonic.',1)),
  T(mc('You hold your head tilted to the left for 2 minutes during a yoga pose. Which hair cells keep reporting the position?',['Type II (tonic)','Type I (phasic)','Inner hair cells','Neither; all hair cells adapt immediately'],'Tonic = maintained response to an unchanging stimulus.',1)),
  T(mc('True or False: Type II hair cells respond only to a change in stimulus.',['False','True'],'That is Type I. One swapped word.',1)),
  T(mc('True or False: The saccule’s hair cells are oriented on a vertical plane.',['True','False'],'Slide 3.')),
  T(mc('True or False: Each otolith organ contains a crista ampullaris.',['False','True'],'Each contains a MACULA. The crista is in the ampulla of a canal.',1)),
  mc('Balance is needed for:',['Posture, coordinating movement, and stabilizing vision while we move','Only posture','Hearing and posture','Smell and taste'],'Notes, Part 1A.'),
]);

/* ---------- Stage 2 ---------- */
STAGE('Direction coding and baseline','Toward vs away from the kinocilium, channels, ions, baseline, rate coding','P1', [
  so('bend','Depolarization','tow','Toward → depolarize.'),
  so('bend','Tip links stretch, channels open','tow','Mechanically gated channels open.'),
  so('bend','More neurotransmitter, ↑ afferent firing','tow','Slide 5.'),
  so('bend','Hyperpolarization','awy','Away → hyperpolarize.'),
  so('bend','Tip links relax, channels close','awy','No cations in.'),
  so('bend','Less neurotransmitter, ↓ afferent firing','awy','Slide 5.'),
  T(mc('Stereocilia bend TOWARD the kinocilium. What happens?',['Depolarization → more neurotransmitter → increased afferent firing','Hyperpolarization → less neurotransmitter → decreased firing','Depolarization → less neurotransmitter → decreased firing','No change, because only magnitude matters'],'⭐ The core rule of the lecture.',1)),
  T(mc('Stereocilia bend AWAY from the kinocilium. What happens?',['Hyperpolarization → less neurotransmitter → decreased afferent firing','Depolarization → more neurotransmitter → increased firing','Hyperpolarization → more neurotransmitter → increased firing','The hair cell fires an action potential'],'⭐ Away = hyperpolarize = ↓ firing.',1)),
  T(mc('When stereocilia bend toward the kinocilium, which ions enter the hair cell, and from where?',['K⁺ and Ca²⁺, from the endolymph','Na⁺ and Ca²⁺, from the perilymph','K⁺ only, from the perilymph','Cl⁻, from the endolymph'],'⭐ Same machinery as cochlear hair cells (Lec 19).',1)),
  T(mc('Why does a hair cell hyperpolarize when bent AWAY from the kinocilium?',['Channels close so no cations enter, but K⁺ still leaks out the base into low-K⁺ perilymph','K⁺ rushes in from the endolymph','Cl⁻ channels open','The otoliths pull Na⁺ out'],'⭐ Notes table: tip links relax, K⁺ keeps leaking out the base.',1)),
  T(mc('With stereocilia in the NEUTRAL position, the afferent neuron:',['Fires at a baseline rate, because some channels are open and a basal level of neurotransmitter is released','Is completely silent','Fires at its maximum rate','Fires only if the kinocilium is bent'],'⭐ Vestibular hair cells have a baseline. That is what lets the signal go up OR down.',1)),
  T(mc('Which is TRUE of vestibular hair cells but NOT cochlear hair cells?',['They have a baseline signal at rest and can bend in both directions','They use tip links','They release neurotransmitter','They sit in endolymph'],'⭐ Cochlear hair cells: no resting signal, bend one way, only a positive signal.',1)),
  T(mc('Why is the baseline firing so important?',['It lets the signal go both up and down, so the brain can read the direction of movement','It saves energy','It keeps the otoliths in place','It prevents adaptation'],'⭐ Without a baseline you could only signal “more,” never “less.”',1)),
  T(mc('How does the brain read the direction AND degree of head movement from one afferent neuron?',['Rate coding: the firing frequency rises or falls from baseline','By the shape of each action potential','By which neurotransmitter is released','By the location of the hair cell on the tongue'],'⭐ “Another example of rate coding.” (Lec 19: rate coding for loudness.)',1)),
  T(mc('A head movement bends a hair cell’s stereocilia a little toward the kinocilium. A bigger movement in the same direction will:',['Increase the firing rate even more','Decrease the firing rate','Switch the cell to hyperpolarization','Not change the rate, only direction is coded'],'Degree is coded by how far the rate moves from baseline.',1)),
  T(mc('In the cochlea, stereocilia bend in only one direction. Why can vestibular stereocilia bend both ways?',['The head can move in many, even opposite, directions','The vestibule has no tip links','The otoliths push them back and forth with sound','The kinocilium rotates'],'Notes: the “problem” that direction coding solves.')),
  T(mc('The tip-link channels in vestibular hair cells are:',['Mechanically gated','Ligand gated by glutamate','cGMP gated','Voltage gated'],'Same as cochlear hair cells.',1)),
  T(mc('She says Type I hair cells “fire action potentials.” What actually fires the APs?',['The afferent (vestibular) neuron; hair cells release neurotransmitter','The hair cell itself','The otoliths','The kinocilium'],'Accuracy note in her notes, same as Lec 19.',1)),
  T(mc('True or False: Vestibular hair cells, like cochlear hair cells, produce no neural signal at rest.',['False','True'],'⭐ Vestibular = baseline; cochlear = none.',1)),
  T(mc('True or False: Bending away from the kinocilium increases neurotransmitter release.',['False','True'],'Away → less.',1)),
  T(mc('The kinocilium is:',['The single tallest cilium at one side of the stereocilia staircase','The shortest stereocilium','The gelatinous membrane','The crystal on top of the membrane'],'Stereocilia are arranged short to long, then one tallest kinocilium.')),
  T(mc('A student recalls: 1. Bending toward the kinocilium depolarizes the cell. 2. Bending away silences the afferent nerve completely. Which is accurate?',['Statement 1 is accurate; statement 2 is not','Statement 2 is accurate; statement 1 is not','Both are accurate','Neither is accurate'],'Away DECREASES firing below baseline. It doesn’t have to go to zero (slide 8: 10 spikes/sec).',1)),
]);

/* ---------- Stage 3 ---------- */
STAGE('Intrinsic slow adaptation','Ca²⁺, myosin, actin, insertional plaque, and why it matters','P1', [
  od('Order the steps of intrinsic slow adaptation.',['Stereocilia bend, tip links stretch','MET channels open, K⁺ and Ca²⁺ enter','Ca²⁺ slowly accumulates inside','Ca²⁺ activates myosin motors','Myosin moves along actin, lowering the insertional plaque','Tip link tension drops, channel closes or partly closes'],'⭐ Slide 5, 6 steps.',1),

  T(mc('True or False: Each of the 20 million olfactory neurons reports to the brain individually.',['False','True'],'They converge by what they detect.',1)),
  T(mc('True or False: Each olfactory neuron can detect many different odor molecules.',['False','True'],'Her version: one receptor type, one molecule.',1)),
]);

/* ---------- Stage 9: her quiz style ---------- */
STAGE('Her trap questions','Scenarios, I–IV combos, two-statement checks, links to other lectures','Mix', [
  T(mc('A student recalls: 1. The utricle detects vertical acceleration. 2. The saccule detects horizontal acceleration. Which is accurate?',['Neither is accurate','Statement 1 is accurate; statement 2 is not','Statement 2 is accurate; statement 1 is not','Both are accurate'],'Both swapped.',1)),
  T(mc('A student recalls: 1. Semicircular canals detect rotation. 2. The cupula has otoconia. Which is accurate?',['Statement 1 is accurate; statement 2 is not','Statement 2 is accurate; statement 1 is not','Both are accurate','Neither is accurate'],'No otoconia in the cupula.',1)),
  T(mc('A student recalls: 1. Vestibular hair cells have a baseline firing. 2. Bending away from the kinocilium decreases firing. Which is accurate?',['Both are accurate','Statement 1 is accurate; statement 2 is not','Statement 2 is accurate; statement 1 is not','Neither is accurate'],'Both correct. Don’t assume one must be wrong.')),
  T(mc('A student recalls: 1. Olfaction bypasses the thalamus. 2. Taste is 80% smell. Which is accurate?',['Both are accurate','Statement 1 is accurate; statement 2 is not','Statement 2 is accurate; statement 1 is not','Neither is accurate'],'Two exam callouts, both true.')),
  T(mc('A student recalls: 1. Type I hair cells are tonic. 2. Adaptation increases tip link tension. Which is accurate?',['Neither is accurate','Statement 1 is accurate; statement 2 is not','Statement 2 is accurate; statement 1 is not','Both are accurate'],'Type I = phasic; adaptation decreases tension.',1)),
  T(mc('Which of the following are TRUE?\nI. The vestibule detects head position relative to gravity\nII. The semicircular canals detect linear acceleration\nIII. The macula contains otoliths\nIV. The cupula is gelatinous',['I, III, and IV','I and III','I, II, III, and IV','II, III, and IV'],'II: canals = rotation.',1)),
  T(mc('Which of the following are TRUE?\nI. Bending toward the kinocilium opens MET channels\nII. K⁺ and Ca²⁺ enter from the perilymph\nIII. Rate coding tells the brain direction and degree\nIV. Cochlear hair cells have no resting signal',['I, III, and IV','I and III','I, II, III, and IV','II and IV'],'II: from the ENDOLYMPH.',1)),
  T(mc('Which of the following are FALSE?\nI. One taste bud can detect only one flavor\nII. The tongue map is accurate\nIII. Taste cells detecting the same taste project to the same cortical region\nIV. Stem cells regenerate taste buds',['I and II','I only','I, II, and III','II and IV'],'III and IV are true.',1)),
  T(mc('Which of the following are FALSE?\nI. Vestibular nuclei → abducens nucleus\nII. Abducens → CN VI → medial rectus\nIII. Crossover → oculomotor nucleus → CN III\nIV. The eyes move in the same direction as the head',['II and IV','II only','IV only','I, II, and IV'],'II: lateral rectus. IV: opposite direction.',1)),
  T(mc('Judy spins on the ice and then glides forward in a straight line and stops suddenly. Which organs detect each phase?',['Spin = semicircular canals; straight glide stop = utricle','Spin = utricle; stop = saccule','Both phases = semicircular canals','Both phases = cochlea'],'Rotation vs horizontal linear. (Applied.)',1)),
  T(mc('After spinning in a chair and stopping suddenly, you feel like you’re still spinning. Best explanation from this lecture?',['Endolymph keeps moving from inertia and keeps deflecting the cupula','Otoliths are still sliding','The cochlea is resonating','The VOR has been cut'],'Inertia works both ways: lag at start, keep going at stop. (Applied.)')),
  T(mc('A patient has lost all VOR function. They read a sign while walking. What do they report?',['The words bounce and blur with every step','The words look normal','They can’t smell anything','They hear the sign'],'Camera with no stabilization.',1)),
  T(mc('A cold blocks your nose. You eat a strawberry and say it “tastes like nothing.” Which statement is correct?',['Your taste buds still detect sweet and sour, but the flavor (mostly smell) is missing','Your taste buds have stopped working','The tongue map changed','Strawberries have no taste molecules'],'⭐ Taste is 80% smell.',1)),
  T(mc('A researcher wires olfactory neurons for odor X into the glomerulus normally used by odor Y. When the subject smells X, they perceive:',['Odor Y','Odor X','Both','Nothing'],'Spatial coding: location decides, like the bitter→sweet question. (Applied.)',1)),
  T(mc('Which coding strategy do taste, smell and tonotopy (Lec 19) share?',['Spatial coding: which location is activated tells the brain what it is','Rate coding','Temporal coding','Population averaging'],'⭐ “Extremely important coding strategy.”',1)),
  T(mc('Which coding strategy does the brain use for DIRECTION and DEGREE of head motion from a single afferent?',['Rate coding','Spatial coding','Tonotopy','Combination coding'],'Firing frequency up or down from baseline.',1)),
  T(mc('Which pairing is correct?',['Macula → otoliths; crista → cupula','Macula → cupula; crista → otoliths','Utricle → crista; ampulla → macula','Saccule → cupula'],'Swapped pairs are her favorite distractors.',1)),
  T(mc('Which pairing is correct?',['Sour → H⁺; salty → Na⁺','Sour → Na⁺; salty → H⁺','Umami → glucose; sweet → glutamate','Bitter → Na⁺'],'Swapped pairs.',1)),
  T(mc('Which pairing is correct?',['CN VI → lateral rectus; CN III → medial rectus','CN VI → medial rectus; CN III → lateral rectus','CN VIII → lateral rectus','CN III → vestibular nuclei'],'VOR output.',1)),
  T(mc('Which pairing is correct?',['Type I → phasic; Type II → tonic','Type I → tonic; Type II → phasic','Type I → horizontal; Type II → vertical','Type I → taste; Type II → smell'],'Slide 3.',1)),
  T(mc('Which statement is FALSE?',['The vestibule detects rotation well because otoliths slide in all directions','Opposite signals across the striola confirm each other','Both ears send parallel vestibular information','Vestibular hair cells have a baseline'],'⭐ Rotation does not give a consistent vestibule signal.',1)),
  T(mc('Which statement is FALSE?',['Olfactory signals relay through the thalamus like other senses','Mitral cells project to specific cortical neurons','Real aromas are mixtures of chemicals','The brain learns aroma patterns'],'⭐ Olfaction bypasses the thalamus.',1)),
  T(mc('Which statement is FALSE?',['Hair cells on both sides of the striola depolarize together','Endolymph lags behind during head rotation','Canals are mirror-symmetric between ears','Adaptation uses myosin'],'Opposite responses across the striola.',1)),
  T(mc('Opposite signals from the striola and from the two ears is the same strategy as:',['ON/OFF bipolar cells (Lec 18)','The visual cycle','Peristalsis','Dopamine reward signaling'],'Her connections table.',1)),
  T(mc('Vestibular hair cells use the same transduction machinery as cochlear hair cells. Which is the same?',['Staircase stereocilia, tip links, mechanically gated channels, K⁺ in from endolymph','Baseline signal at rest','Bending in both directions','Otoliths'],'The other three are what makes the vestibule different.',1)),
  T(mc('The VOR uses CN VIII in and CN VI + CN III out. Which earlier lecture idea is this like?',['A reflex arc: sensory input → brainstem interneurons → motor output to skeletal muscle','The direct/indirect pathway','The visual cycle','The enteric nervous system'],'Lec 14 link.')),
  T(mc('True or False: The vestibule and semicircular canals are interchangeable; either can detect any head motion.',['False','True'],'⭐ “Not interchangeable.”',1)),
  T(mc('True or False: In the pizza question, the answer is that pizza gives off many chemicals no other food has.',['False','True'],'⭐ Common chemicals, unique COMBINATION.',1)),
  T(mc('True or False: If a bitter taste cell were wired to the sweet cortex, bitter molecules would taste sweet.',['True','False'],'⭐ Location decides.')),
]);

/* ---------- Stage 10: her in-lecture questions ---------- */
function LQ(q,o,why){ return T(mc(q,o,why,1)); }
STAGE('Her in-lecture questions','The five questions she worked through, word for word from the slides','Clicker', [
  LQ('Which of the following best describes how the direction of head movement is encoded by vestibular hair cells?\n\nA. Hair cells fire action potentials in response to any direction of bending.\nB. Bending of stereocilia toward the kinocilium depolarizes the hair cell, while bending away from the kinocilium hyperpolarizes it.\nC. Hair cell activation is only dependent on the magnitude of movement, not its direction.\nD. None of the above',['B','A','C','D'],'A is “not completely true”: there is baseline firing even with no bending. C: “obviously not true,” direction changes the response.'),
  LQ('Which of the following helps Judy balance herself during a sit spin in her skating program?\n\nA. Cochlea\nB. Vestibule\nC. Semicircular canals',['C','B','A','B and C'],'A spin is pure angular acceleration. The cochlea is for sound; the vestibule needs linear acceleration or tilt.'),
  LQ('T/F: one taste bud can detect one flavor\n\nA. True\nB. False',['B. False','A. True'],'Each taste CELL detects one taste, but a bud mixes cell types, so one bud detects all 5.'),
  LQ('If a bitter cell is engineered to synapse onto neurons in the sweet domain of the cortex, what sensation will it generate once stimulated by bitter molecules?\n\nA. Sweet\nB. Bitter\nC. Both sweet and bitter',['A. Sweet','B. Bitter','C. Both sweet and bitter'],'Location in the cortex decides the sensation, not the molecule.'),
  LQ('A pizza has a unique smell because ________\n\nA. It gives off a unique chemical that no other food has\nB. It gives off many unique chemicals that no other food has\nC. It gives off many chemicals that other foods also offers, but the combination is unique',['C','B','A'],'“The key is combination.” Cheese, toppings and sauce show up in lots of other foods.'),
]);


</script>
<script>
const KEY='l20climb_v1';
const store = { get(){ try{ return JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){ return {}; } },
  set(v){ try{ localStorage.setItem(KEY, JSON.stringify(v)); }catch(e){} } };
let SAVE = Object.assign({stars:{}, miss:[], best:0, theme:null}, store.get());
if (SAVE.theme) document.documentElement.setAttribute('data-theme', SAVE.theme);
const ALL = STAGES.flatMap(s=>s.items);
const byId = Object.fromEntries(ALL.map(i=>[i.id,i]));
const app = document.getElementById('app');
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const starHTML = n => '<i>'+'★'.repeat(n)+'</i>'+'★'.repeat(3-n);

/* ---------- home ---------- */
function home(){
  // Stage map: vestibule → canals → taste and smell
  const P=[[34,40],[80,56],[126,72],[172,86],[218,100],[264,112],[310,124],[356,136],[402,148],[448,160],[494,172]];
  const curve = 'M'+P.map(p=>p.join(',')).join(' L');
  const dots = STAGES.map((s,i)=>{const [x,y]=P[i]; const done=(SAVE.stars[i]||0)===3; return `<g class="dot${done?' done':''}" data-stage="${i}" role="button" tabindex="0" aria-label="Stage ${i+1}: ${esc(s.name)}"><circle cx="${x}" cy="${y}" r="11"></circle><text x="${x}" y="${y}">${i+1}</text></g>`;}).join('');
  const missN = SAVE.miss.filter(id=>byId[id]).length;
  const trN = ALL.filter(i=>i.trap).length;
  const hyN = ALL.filter(i=>i.hy).length;
  app.innerHTML = `
  <div class="top"><span class="eyebrow">A&amp;P · Lecture 20</span><button class="ghost" id="theme">${themeLabel()}</button></div>
  <div class="hero"><h1>Balance Smell Taste Climb</h1><p>Ten stops from the inner ear to the nose: the vestibule and macula, direction coding and baseline firing, slow adaptation, the striola, the semicircular canals, the VOR circuit (traced in words, with damage cases), taste, and smell. Built around her style: one-word swaps (utricle/saccule, toward/away, Type I/II, CN VI/III), two-statement checks, I–IV combos and scenarios. Stage 10 is her five in-lecture questions, word for word from the slides. No diagram questions.</p></div>
  <div class="trace" aria-label="Stage map from balance to taste and smell">
    <svg viewBox="0 0 510 200" role="img">
      <line class="grid" x1="10" y1="182" x2="500" y2="182"></line>
      <text class="ax" x="30" y="22">vestibule</text><text class="ax" x="120" y="58">hair cells · striola</text><text class="ax" x="80" y="130">canals · VOR</text><text class="ax" x="380" y="196">taste · smell</text>
      <path class="curve" d="${curve}"></path>${dots}
    </svg>
  </div>
  <div class="modes">
    <button class="mode" data-mode="hy"><b>High-Yield Run</b><span>${hyN} starred items, shuffled</span></button>
    <button class="mode" data-mode="miss" ${missN?'':'disabled'}><b>Your Misses</b><span>${missN?missN+' to clear':'Nothing missed yet'}</span></button>
    <button class="mode" data-mode="trap"><b>Trap Drill</b><span>${trN} trap and scenario questions</span></button>
    <button class="mode" data-mode="mix"><b>Mixed 20</b><span>20 random from every stage</span></button>
  </div>
  <div class="eyebrow" style="margin-bottom:8px">Stages · ${ALL.length} questions</div>
  <div class="stages">${STAGES.map((s,i)=>`<button class="stage" data-stage="${i}"><span class="mv">${s.mv}</span><span><h3>${i+1}. ${esc(s.name)}</h3><small>${esc(s.sub)} · ${s.items.length} Qs</small></span><span class="stars">${starHTML(SAVE.stars[i]||0)}</span></button>`).join('')}</div>
  <p class="foot">Stars count first-try accuracy: 90% for three, 75% for two, 50% for one. Anything you miss comes back at the end of the run until you get it, and lands in Your Misses.</p>`;
  app.querySelectorAll('[data-stage]').forEach(b=>{ const go=()=>startRun('stage',+b.dataset.stage); b.addEventListener('click',go); b.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();go();} }); });
  app.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>startRun(b.dataset.mode)));
  document.getElementById('theme').onclick = toggleTheme;
  // stages list top = last stage climbs upward visually? keep order 1..8 for reading.
}
function themeLabel(){ const t=document.documentElement.getAttribute('data-theme'); return t==='dark'?'Dark':t==='light'?'Light':'Auto'; }
function toggleTheme(){ const r=document.documentElement; const t=r.getAttribute('data-theme'); const n = t===null?'dark':t==='dark'?'light':null; if(n) r.setAttribute('data-theme',n); else r.removeAttribute('data-theme'); SAVE.theme=n; store.set(SAVE); document.getElementById('theme').textContent=themeLabel(); }

/* ---------- run ---------- */
let R=null;
function startRun(mode, stage){
  let items, title;
  if(mode==='stage'){ items = STAGES[stage].items.slice(); title = (stage+1)+'. '+STAGES[stage].name; }
  else if(mode==='hy'){ items = shuffle(ALL.filter(i=>i.hy)); title='High-Yield Run'; }
  else if(mode==='miss'){ items = shuffle(SAVE.miss.map(id=>byId[id]).filter(Boolean)); title='Your Misses'; }
  else if(mode==='trap'){ items = shuffle(ALL.filter(i=>i.trap)); title='Trap Drill'; }
  else { items = shuffle(ALL).slice(0,20); title='Mixed 20'; }
  R = {mode, stage, title, queue: items.map(it=>({it, retry:false})), total: items.length, firstRight:0, firstDone:0, score:0, streak:0, missed:[], pos:0};
  renderItem();
}
function mult(){ return Math.min(4, 1+Math.floor(R.streak/3)); }
function hud(){
  const done = R.firstDone; const pct = Math.round(100*done/R.total);
  return `<div class="hud"><div class="hudrow"><button class="ghost" id="quit">← Map</button><span>${esc(R.title)}</span><span>${R.score} pts <span class="mult">×${mult()}</span></span></div>
  <div class="bar"><i style="width:${pct}%"></i></div><div class="hudrow"><span>${Math.min(done+1,R.total)} / ${R.total}${R.queue[R.pos]&&R.queue[R.pos].retry?' · retry':''}</span><span>streak ${R.streak}</span></div></div>`;
}
function figHTML(key, item){
  const d = DIA[key]; if(!d) return '';
  const mask = d.mask!==false;
  let boxes = '';
  if(item && (item.t==='lb'||item.t==='nm')){
    let tIdx = -1;
    if(item.t==='nm'){ let k=0; d.b.forEach((b,i)=>{ if(b[4]===item.name){ if(k===item.idx) tIdx=i; k++; } }); }
    boxes = d.b.map((b,i)=>{
      const cls = item.t==='lb' ? 'box tap' : (i===tIdx ? 'box target' : 'box');
      if(!mask && item.t==='nm' && i!==tIdx) return '';
      const tag = item.t==='lb' ? 'button' : 'div';
      return `<${tag} class="${cls}" data-bi="${i}" data-name="${esc(b[4])}" style="left:${b[0]}%;top:${b[1]}%;width:${b[2]}%;height:${b[3]}%" ${item.t==='lb'?'aria-label="covered label"':''}></${tag}>`;
    }).join('');
  }
  return `<div class="fig ${mask?'':'nomask'}"><img src="${d.img}" alt="${esc(d.title)}">${boxes}</div><div class="figcap">${esc(d.title)}</div>`;
}
function renderItem(){
  if(R.pos>=R.queue.length) return finish();
  const {it, retry} = R.queue[R.pos];
  const typeName = {mc:'Multiple choice',so:'Sort',od:'Order',mt:'Match',lb:'Tap the label',nm:'Name the box'}[it.t];
  let body = '';
  const tag = `<div class="tag">${typeName}${it.trap?' <span class="tr">trap</span>':''}${it.hy?' <span class="hy">high yield</span>':''}${retry?' · second chance':''}</div>`;
  if(it.t==='mc'){
    const opts = shuffle(it.o);
    body = (it.ctx?`<div class="ctx">${esc(it.ctx)}</div>`:'') + (it.img?figHTML(it.img):'') + `<p class="q">${esc(it.q)}</p><div class="opts">${opts.map(o=>`<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
  } else if(it.t==='so'){
    const S = SORTS[it.set];
    body = `<p class="q">${esc(S.label)}</p><div class="sortitem">${esc(it.item)}</div><div class="cats">${S.cats.map(c=>`<button class="cat" data-key="${c[0]}" style="--cc:var(${c[2]})">${esc(c[1])}</button>`).join('')}</div>`;
  } else if(it.t==='od'){
    body = `<p class="q">${esc(it.q)}</p><div class="seq" id="seq"></div><div class="chips">${shuffle(it.steps).map(s=>`<button class="chip" data-v="${esc(s)}">${esc(s)}</button>`).join('')}</div><div class="actions"><button class="ghostbtn" id="undo">Undo</button></div>`;
  } else if(it.t==='mt'){
    body = `<p class="q">${esc(it.q)}</p><div class="mtgrid"><div class="mtcol">${it.pairs.map(p=>`<button class="mtb L" data-v="${esc(p[0])}">${esc(p[0])}</button>`).join('')}</div><div class="mtcol">${shuffle(it.pairs.map(p=>p[1])).map(v=>`<button class="mtb Rr" data-v="${esc(v)}">${esc(v)}</button>`).join('')}</div></div>`;
  } else if(it.t==='lb'){
    body = `<p class="q">Tap the covered label: <span style="color:var(--accent)">${esc(it.name)}</span></p>` + figHTML(it.dia,it);
  } else if(it.t==='nm'){
    const d=DIA[it.dia];
    let opts;
    if(it.o) opts = it.o.slice();
    else { const names=[...new Set(d.b.map(b=>b[4]))].filter(n=>n!==it.name); opts=[it.ans, ...shuffle(names).slice(0,3)]; }
    body = figHTML(it.dia,it) + `<p class="q">${esc(it.q||'Name the label in the orange box.')}</p><div class="opts">${shuffle(opts).map(o=>`<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
  }
  app.innerHTML = hud() + `<div class="card" id="card">${tag}${body}<div id="fb"></div></div>`;
  document.getElementById('quit').onclick = ()=>{ R=null; home(); };
  wire(it);
  window.scrollTo(0,0);
}
function wire(it){
  const card = document.getElementById('card');
  if(it.t==='mc' || it.t==='nm'){
    const right = it.t==='mc' ? it.o[0] : it.ans;
    card.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const ok = b.dataset.v===right;
      card.querySelectorAll('.opt').forEach(x=>{ x.disabled=true; if(x.dataset.v===right) x.classList.add('right'); });
      if(!ok) b.classList.add('wrong');
      if(it.t==='nm'){ const t=card.querySelector('.box.target'); if(t){ t.classList.add('right'); } }
      answer(ok, it.t==='nm' && !ok ? 'It was: '+it.ans : (ok?'':'Answer: '+right));
    });
  } else if(it.t==='so'){
    card.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{
      const ok = b.dataset.key===it.key;
      card.querySelectorAll('.cat').forEach(x=>{ x.disabled=true; if(x.dataset.key===it.key) x.classList.add('right'); });
      if(!ok) b.classList.add('wrong');
      const S=SORTS[it.set]; answer(ok, ok?'':'Answer: '+S.cats.find(c=>c[0]===it.key)[1]);
    });
  } else if(it.t==='lb'){
    card.querySelectorAll('.box.tap').forEach(b=>b.onclick=()=>{
      if(card.dataset.done) return; card.dataset.done=1;
      const ok = b.dataset.name===it.name;
      card.querySelectorAll('.box.tap').forEach(x=>{ x.disabled=true; if(x.dataset.name===it.name) x.classList.add('right'); });
      if(!ok) b.classList.add('wrong');
      answer(ok, ok?'':'The green outline shows where it is.');
    });
  } else if(it.t==='od'){
    const seq=[]; const seqEl=document.getElementById('seq');
    const draw=()=>{ seqEl.innerHTML = seq.map((s,i)=>`<div class="slot"><span>${i+1}</span><span>${esc(s)}</span></div>`).join(''); };
    card.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
      seq.push(b.dataset.v); b.disabled=true; draw();
      if(seq.length===it.steps.length){
        const ok = seq.every((s,i)=>s===it.steps[i]);
        seqEl.querySelectorAll('.slot').forEach((el,i)=>{ if(seq[i]!==it.steps[i]) el.classList.add('wrong'); });
        document.getElementById('undo').disabled=true;
        answer(ok, ok?'':'Correct order: '+it.steps.map((s,i)=>(i+1)+') '+s).join('  '));
      }
    });
    document.getElementById('undo').onclick=()=>{ const v=seq.pop(); if(v==null) return; const c=[...card.querySelectorAll('.chip')].find(x=>x.dataset.v===v&&x.disabled); if(c) c.disabled=false; draw(); };
  } else if(it.t==='mt'){
    let selL=null; const made={};
    const L=[...card.querySelectorAll('.mtb.L')], Rr=[...card.querySelectorAll('.mtb.Rr')];
    L.forEach(b=>b.onclick=()=>{ if(b.classList.contains('paired')) return; L.forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); selL=b; });
    Rr.forEach(b=>b.onclick=()=>{
      if(!selL || b.classList.contains('paired')) return;
      made[selL.dataset.v]=b.dataset.v; selL.classList.remove('sel'); selL.classList.add('paired'); b.classList.add('paired');
      selL.textContent = selL.dataset.v+' → '+b.dataset.v; selL=null;
      if(Object.keys(made).length===it.pairs.length){
        const ok = it.pairs.every(p=>made[p[0]]===p[1]);
        L.forEach(x=>{ const p=it.pairs.find(p=>p[0]===x.dataset.v); x.classList.add(made[p[0]]===p[1]?'right':'wrong'); });
        answer(ok, ok?'':'Pairs: '+it.pairs.map(p=>p[0]+' → '+p[1]).join(' · '));
      }
    });
  }
}
function answer(ok, extra){
  const q = R.queue[R.pos];
  if(!q.retry){
    R.firstDone++;
    if(ok){ R.firstRight++; }
    else { R.missed.push(q.it.id); if(!SAVE.miss.includes(q.it.id)) SAVE.miss.push(q.it.id); }
  }
  if(ok){ R.score += 10*mult(); R.streak++; if(R.mode==='miss'||q.retry) SAVE.miss = SAVE.miss.filter(id=>id!==q.it.id); }
  else { R.streak=0; R.queue.push({it:q.it, retry:true}); }
  store.set(SAVE);
  const fb = document.getElementById('fb');
  fb.innerHTML = `<div class="fb ${ok?'ok':'no'}"><b>${ok?'Correct':'Not quite'}</b>${extra?esc(extra)+'<br>':''}${esc(q.it.why||'')}</div><button class="next" id="next">${R.pos+1<R.queue.length?'Next':'See results'}</button>`;
  const n=document.getElementById('next'); n.onclick=()=>{ R.pos++; renderItem(); }; n.focus({preventScroll:true});
  fb.scrollIntoView({block:'nearest',behavior:'smooth'});
}
function finish(){
  const acc = R.total? R.firstRight/R.total : 0;
  const st = acc>=0.9?3:acc>=0.75?2:acc>=0.5?1:0;
  if(R.mode==='stage'){ SAVE.stars[R.stage]=Math.max(SAVE.stars[R.stage]||0, st); }
  SAVE.best=Math.max(SAVE.best||0,R.score); store.set(SAVE);
  const missed=[...new Set(R.missed)].map(id=>byId[id]);
  const label = it => it.t==='so'?it.item : (it.t==='lb'||it.t==='nm')? (it.q||'Label')+': '+it.ans : it.q;
  app.innerHTML = `<div class="card result" style="margin-top:18px"><div class="eyebrow">${esc(R.title)}</div><h2>${st===3?'Summit':st===2?'Almost there':st===1?'Halfway up':'Keep climbing'}</h2>
    <div class="big-stars">${starHTML(st)}</div>
    <p class="stat">${R.firstRight}/${R.total} first try (${Math.round(acc*100)}%) · ${R.score} pts · best ${SAVE.best}</p>
    ${missed.length?`<div class="eyebrow" style="margin-top:12px">Missed on first try</div><ul class="misslist">${missed.map(it=>`<li>${esc(label(it))}</li>`).join('')}</ul>`:''}
    <div class="actions" style="margin-top:16px"><button class="next" id="again">Run it again</button><button class="ghostbtn" id="map">Back to map</button></div></div>`;
  document.getElementById('again').onclick=()=>startRun(R.mode,R.stage);
  document.getElementById('map').onclick=()=>{ R=null; home(); };
}
window.GAME = { cur: ()=> R && R.queue[R.pos] ? R.queue[R.pos].it : null, STAGES, DIA, SORTS, startRun, home };

home();
</script>
