<style>
/* Layout: one narrow column; home = a descending motor pathway where each stage is a stop from cortex to muscle, run = card + figure + choices */
:root{
  --bg:#EDF1EE; --panel:#FFFFFF; --panel2:#F6F8F6; --ink:#15201C; --muted:#5A6A64; --line:#CFD9D4;
  --accent:#0C7A63; --accent-ink:#FFFFFF; --cover:#EE8A22; --cover-dim:#B9C4BF; --ok:#1C8A4B; --bad:#C2372C; --star:#D99A0B;
  --c1:#2F6FB7; --c2:#8A5BB0; --c3:#0C7A63; --c4:#C9821A; --c5:#C4467E;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1513; --panel:#16201D; --panel2:#1B2723; --ink:#E3ECE8; --muted:#93A7A0; --line:#2A3A35;
  --accent:#43CF9E; --accent-ink:#06231A; --cover:#F0922E; --cover-dim:#4A5853; --ok:#4FC47D; --bad:#F2695D; --star:#F2B930;
  --c1:#6FA6EA; --c2:#B88BE0; --c3:#43CF9E; --c4:#EAA94A; --c5:#EE7BB0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1513; --panel:#16201D; --panel2:#1B2723; --ink:#E3ECE8; --muted:#93A7A0; --line:#2A3A35;
  --accent:#43CF9E; --accent-ink:#06231A; --cover:#F0922E; --cover-dim:#4A5853; --ok:#4FC47D; --bad:#F2695D; --star:#F2B930;
  --c1:#6FA6EA; --c2:#B88BE0; --c3:#43CF9E; --c4:#EAA94A; --c5:#EE7BB0; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;margin:0}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:18px 48px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.box:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px}
.hero h1{font-size:clamp(30px,7vw,46px);font-weight:800;line-height:1.02;letter-spacing:-.01em;margin-top:6px}
.hero p{color:var(--muted);margin:8px 0 0;max-width:60ch}
.trace{margin:18px 0 6px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 6px 4px;overflow:hidden}
.trace svg{display:block;width:100%;height:auto}
.trace .grid{stroke:var(--line);stroke-width:1}
.trace .curve{fill:none;stroke:var(--accent);stroke-width:3;stroke-linejoin:round}
.trace .dot{cursor:pointer}
.trace .dot circle{fill:var(--panel);stroke:var(--accent);stroke-width:2.5}
.trace .dot.done circle{fill:var(--accent)}
.trace .dot text{font-family:var(--mono);font-size:12px;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.trace .dot.done text{fill:var(--accent-ink)}
.trace .ax{font-family:var(--mono);font-size:10px;fill:var(--muted)}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:16px 0 22px}
.mode{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:2px}
.mode b{font-family:var(--display);font-weight:700;font-size:17px}
.mode span{color:var(--muted);font-size:13px}
.mode:disabled{opacity:.45;cursor:default}
.stages{display:flex;flex-direction:column;gap:8px}
.stage{display:grid;grid-template-columns:64px minmax(0,1fr) auto;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;width:100%}
.stage .mv{font-family:var(--mono);font-size:13px;white-space:nowrap;color:var(--accent);font-variant-numeric:tabular-nums}
.stage h3{font-size:18px;font-weight:700}
.stage small{color:var(--muted);display:block;font-size:13px}
.stars{font-size:16px;letter-spacing:2px;color:var(--line);white-space:nowrap}
.stars i{font-style:normal;color:var(--star)}
.foot{color:var(--muted);font-size:13px;margin-top:22px}
/* run */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px;display:flex;flex-direction:column;gap:8px}
.hudrow{display:flex;align-items:center;gap:10px;justify-content:space-between;font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.mult{color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:8px}
.ctx{background:var(--panel2);border-left:3px solid var(--accent);padding:8px 12px;border-radius:6px;margin-bottom:12px;font-size:15px}
.tag{display:inline-flex;gap:6px;align-items:center;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.tag .hy{color:var(--bad);border:1px solid currentColor;border-radius:4px;padding:0 5px}
.q{font-size:18px;font-weight:700;margin:2px 0 12px}
.fig{position:relative;width:100%;margin:4px 0 4px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#fff}
.fig img{display:block;width:100%;height:auto}
.box{position:absolute;border-radius:3px;background:var(--cover-dim);border:0;padding:0}
.box.target{background:var(--cover);box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--cover)}
.box.tap{background:var(--cover);cursor:pointer}
.box.tap:hover{filter:brightness(1.08)}
.nomask .box{background:transparent}
.nomask .box.target{background:color-mix(in srgb,var(--cover) 14%,transparent);box-shadow:none;outline:3px solid var(--cover);outline-offset:-3px}
.box.right{background:transparent!important;outline:3px solid var(--ok);outline-offset:-1px;box-shadow:none}
.box.wrong{background:transparent!important;outline:3px solid var(--bad);outline-offset:-1px;box-shadow:none}
.figcap{font-size:12px;color:var(--muted);margin:2px 0 12px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;background:var(--panel2);border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;font-size:16px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--panel))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--panel))}
.opt:disabled{cursor:default}
.sortitem{font-size:18px;font-weight:700;background:var(--panel2);border:1px dashed var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cat{border:2px solid var(--cc);background:color-mix(in srgb,var(--cc) 10%,var(--panel));border-radius:10px;padding:12px 10px;font-weight:700}
.cat.right{outline:3px solid var(--ok);outline-offset:2px}
.cat.wrong{outline:3px solid var(--bad);outline-offset:2px}
.seq{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;min-height:20px}
.seq .slot{font-family:var(--mono);font-size:14px;padding:8px 10px;border-radius:8px;background:color-mix(in srgb,var(--accent) 12%,var(--panel));display:flex;gap:8px}
.seq .slot.wrong{background:color-mix(in srgb,var(--bad) 14%,var(--panel))}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--panel2);border:1.5px solid var(--line);border-radius:999px;padding:8px 13px;font-size:15px}
.chip:disabled{opacity:.3}
.mtgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.mtcol{display:flex;flex-direction:column;gap:8px}
.mtb{text-align:left;background:var(--panel2);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px}
.mtb.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.mtb.paired{opacity:.55}
.mtb.right{border-color:var(--ok)} .mtb.wrong{border-color:var(--bad)}
.fb{margin-top:14px;border-radius:10px;padding:12px 14px;font-size:15px}
.fb.ok{background:color-mix(in srgb,var(--ok) 12%,var(--panel));border:1px solid var(--ok)}
.fb.no{background:color-mix(in srgb,var(--bad) 10%,var(--panel));border:1px solid var(--bad)}
.fb b{display:block;margin-bottom:2px}
.next{margin-top:14px;width:100%;background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:13px;font-weight:700;font-size:17px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.actions .next{flex:1 1 160px;margin-top:0}
.actions .ghostbtn{flex:1 1 160px;background:none;border:1.5px solid var(--line);border-radius:12px;padding:13px;font-weight:700}
.result h2{font-size:30px;margin:6px 0}
.big-stars{font-size:38px;letter-spacing:6px;color:var(--line)} .big-stars i{font-style:normal;color:var(--star)}
.stat{font-family:var(--mono);font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.misslist{margin:12px 0 0;padding-left:18px;font-size:14px;color:var(--muted)}
@media (max-width:440px){.stage{grid-template-columns:54px minmax(0,1fr) auto;gap:10px;padding:12px}.stars{font-size:13px;letter-spacing:1px}.cats{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
const DIA = {};
const STAGES = [];
let _sid = 0;
function STAGE(name, sub, mv, items){ const s = {name, sub, mv, items: items.flat()}; s.items.forEach((it,i)=>{ it.id = 's'+STAGES.length+'_'+i; it.stage = STAGES.length; }); STAGES.push(s); }
function mc(q,o,why,red){ return {t:'mc',q,o,why,hy:!!red}; }
function im(img,q,o,why,red){ return {t:'mc',img,q,o,why,hy:!!red}; }
function so(set,item,key,why,red){ return {t:'so',set,item,key,why,hy:!!red}; }
function od(q,steps,why,red){ return {t:'od',q,steps,why,hy:!!red}; }
function mt(q,pairs,why,red){ return {t:'mt',q,pairs,why,hy:!!red}; }
function lb(dia,name,why,red){ return {t:'lb',dia,name,why,hy:!!red}; }
function nm(dia,name,why,red,q,x){ x=x||{}; return {t:'nm',dia,name,why,hy:!!red,q:q||null,o:x.o||null,ans:x.ans||name,idx:x.idx||0}; }
function cs(text,steps,red,img){ return steps.map(s=>({t:'mc',ctx:text,img:img||null,q:s[0],o:s[1],why:s[2],hy:!!red})); }
</script>
<script>
// ===== Lecture 14 content =====
function tr(q,o,why,red){ return {t:'mc',q,o,why,hy:!!red,trap:true}; }
const SORTS = {
  comp: {label: 'Which component of proper motor control?', cats: [['vol','Volition','--c1'],['coord','Coordination of many muscle groups','--c2'],['prop','Proprioception & sensory feedback','--c3'],['adapt','Adaptability','--c4'],['auto','Unconscious processing','--c5']]},
  level: {label: 'Which level of the hierarchy?', cats: [['assoc','Association cortex (global planning)','--c1'],['motor','Motor cortex (global implementation)','--c2'],['bs','Brainstem (nuts and bolts)','--c4'],['sc','Spinal cord (nuts and bolts)','--c3']]},
  area: {label: 'Which motor cortex area?', cats: [['pm','Premotor cortex','--c1'],['sma','SMA','--c5'],['m1','Primary motor cortex (M1)','--c3']]},
  tract: {label: 'Which tract?', cats: [['lcst','Lateral corticospinal (LCST)','--c1'],['acst','Anterior corticospinal (ACST)','--c3'],['cbt','Corticobulbar','--c4']]},
  aff: {label: 'Type Ia, Type II, or both?', cats: [['ia','Type Ia only','--c1'],['ii','Type II only','--c4'],['both','Both Ia and II','--c3']]},
  fiber: {label: 'Extrafusal or intrafusal fiber?', cats: [['ex','Extrafusal','--c4'],['in','Intrafusal','--c1']]},
  side: {label: 'Contralateral or ipsilateral weakness?', cats: [['contra','Contralateral (opposite side)','--c5'],['ipsi','Ipsilateral (same side)','--c1']]},
};

STAGE('Why Movement Needs a Boss', 'Parameters, UMN vs LMN, the 5 components', 'Muscle', [
  mc('Each skeletal muscle fiber is connected to the brain through how many motor neurons?',['2: an upper and a lower motor neuron','1: a single motor neuron from cortex to muscle','3: cortical, brainstem and spinal','It varies with muscle size'],'Slide 3: "Each muscle fiber is connected to the brain through 2 motor neurons."',1),
  mc('Which neuron directly innervates the muscle fibers?',['Lower motor neuron (LMN)','Upper motor neuron (UMN)','Interneuron','Type Ia afferent'],'UMN → LMN → muscle fibers.',1),
  mc('How does a UMN grade its output?',['By firing at different frequencies (rate coding)','By changing which neurotransmitter it releases','By changing its axon diameter','By recruiting more UMNs only'],'Her notes: the UMN "fires at different frequencies (rate coding)."'),
  od('Put the 5 parameters of SkM contraction in slide order.',['Timing','Force','Direction','Speed','Range of motion'],'Slide 3 list: 1) Timing 2) Force 3) Direction 4) Speed 5) Range of motion.',1),
  mc('On slide 3, "Direction" is achieved by:',['Balancing force from multiple muscle groups','Firing a single muscle harder','Changing joint shape','The muscle spindle alone'],'Direction = balance Force from multiple muscle groups. Force is highlighted twice on the slide.',1),
  mc('Which parameter covers "initiation and duration"?',['Timing','Force','Speed','Range of motion'],'Slide 3: 1) Timing (initiation and duration).'),
  mc('About how many muscles are used to walk, across the whole body?',['Over 200','About 12','About 40','Exactly 6'],'Over 200 muscles in the whole body, 40 to 50 per leg.'),
  mc('What is the real question slide 3 ends on?',['Who is controlling and coordinating UMN activity?','How does the LMN release ACh?','Why do muscles fatigue?','Where is the trigger zone?'],'The "?" box over UMN-1 to UMN-4. The rest of the lecture answers it.'),
  od('Put the 5 components of proper motor control in slide order.',['Volition','Coordination of signals to many muscle groups','Proprioception and sensory feedback','Adaptability','Unconscious processing'],'Slide 4 list.',1),
  so('comp','Goals are evaluated and set; the motor system turns them into muscle actions','vol','Volition definition, slide 5.',1),
  so('comp','Multiple muscle groups are coordinated in time and force for smooth motion','coord','Slide 5 definition.'),
  so('comp','Informs position and tension of muscles and joints','prop','Slide 6 definition.'),
  so('comp','Modifies output to accomplish the same goals when conditions change','adapt','Slide 6 definition.',1),
  so('comp','Many motor tasks are automatic and need no conscious processing','auto','Slide 6 definition.'),
  so('comp','Gymnasts relying on hours of training under crowd pressure','auto','Her example: the purpose of athletic training is a routine, unconscious motor plan.'),
  so('comp','Walking on ice: slow down, shorter steps, wider stance, use your arms','adapt','Her Kyiv ice example.'),
  so('comp','A drunk man cannot sense where his legs are and stumbles','prop','Her drunk walk example.'),
  mc('Why does smooth movement need the sensory cortex next to M1?',['Sensory cortex sends joint, muscle and surroundings info to motor cortex (heavy cross talk)','Sensory cortex fires the LMNs directly','M1 has no blood supply of its own','They are the same area'],'Notes: S1 and M1 sit side by side with extensive cross talk.'),
  mc('What is the point of all athletic training, according to her?',['Build routine, repeatable, unconscious motor plans','Grow more UMNs','Make muscles bigger only','Speed up nerve conduction'],'Unconscious processing frees the brain and protects against crowd pressure.'),
  tr('A student says: "The upper motor neuron innervates the muscle fiber, and the lower motor neuron relays the signal back to the brain." What is wrong?',['The UMN innervates the LMN; the LMN directly innervates the muscle fibers','Nothing, that is correct','The LMN is sensory, so it relays to the brain','The UMN and LMN are the same neuron'],'Trap: "lower" does not mean sensory. UMN → LMN → muscle fibers; both are motor.',1),
  tr('Which parameter of SkM contraction can NOT be set by one muscle acting alone?',['Direction','Force','Timing','Speed'],'Direction = balance of force from multiple muscle groups. One muscle can only pull one way harder or softer.',1),
  tr('Every single muscle in a walking leg is perfectly healthy and its LMN fires normally, yet the person stumbles. Which idea from slide 3 explains this best?',['The UMNs are not organized into the right timing, sequence and force pattern','Each muscle needs more than 2 motor neurons','Walking uses only 6 muscles','LMNs can only fire once per step'],'Her point: muscles must activate at the right time, in the right sequence, with the right force. That coordination of UMNs is the question the lecture answers.',1),
  tr('A gymnast performs a routine perfectly in practice but also under a screaming crowd. Which component is she relying on most?',['Unconscious processing','Volition','Adaptability','Proprioception alone'],'Trap: it is not adaptability (nothing about the task changed). Training builds automatic motor plans that free the brain and protect from crowd pressure.'),
  tr('You walk your usual route, but today it is icy. You shorten your steps and widen your stance and still get to class. Which component is this, and why is it NOT volition?',['Adaptability: the goal stays the same, only the output changes','Volition: you decided to walk to class','Unconscious processing: you did not think about it','Coordination: more muscles were used'],'Adaptability = modify output to accomplish the SAME goal. Volition is setting the goal, which did not change.',1),
  tr('Close your eyes and touch your nose. Which component makes this possible?',['Proprioception and sensory feedback','Volition','Adaptability','Unconscious processing'],'Her example for proprioception: sense of position without vision.'),
  tr('A person sets a clear goal and has healthy muscles, but cannot sense where their limbs are. What happens to the movement?',['It can start but is poorly controlled, because the motor program cannot be corrected','It is perfectly accurate because the goal is clear','It cannot start at all','Only the face is affected'],'Sensory feedback lets motor programs be modified so movement is accurate. The drunk walk is the slide example.'),
  tr('Why does M1 need to sit right next to the somatosensory cortex?',['Continuous joint, muscle and surroundings information feeds the motor commands','So M1 can send commands to the skin','Because they share the same neurons','So the somatosensory cortex can fire LMNs'],'Notes: smooth movement depends on motor commands PLUS continuous accurate sensory feedback, with cross talk between the two cortexes.'),
  tr('If skilled movement were rigid instead of flexible, which component would be missing?',['Adaptability','Volition','Rate coding','Muscle tone'],'Her adaptability point: skilled movement is flexible, not rigid.'),
  tr('Which of the following are TRUE? I. Each muscle fiber connects to the brain through 2 motor neurons. II. The UMN directly innervates muscle fibers. III. Direction is set by balancing force from multiple muscle groups. IV. Unconscious processing frees the brain for other information.',['I, III, and IV','I and III','I, II, and III','All of the above'],'II is the trap: the LMN innervates muscle fibers, not the UMN.',1),
  tr('A student recalls: 1. "Adaptability means setting a new goal when conditions change." 2. "Proprioception informs the position and tension of muscles and joints." Which is accurate?',['Statement 2 is accurate; statement 1 is not (adaptability keeps the SAME goal and changes the output)','Both are accurate','Statement 1 is accurate; statement 2 is not','Neither is accurate'],'Slide 6: adapt to changes, modify output to accomplish the same goals.',1),
  tr('True or False: Walking can be explained by each leg muscle\'s LMN firing on its own, without higher coordination of UMNs.',['False','True'],'Over 200 muscles must fire in the right time, sequence and force: UMNs must be organized into a timed pattern.',1),
]);

STAGE('The Chain of Command', 'Hierarchy of motor activities (slide 7)', 'Chain', [
  so('level','Prefrontal cortex','assoc','Association cortex = prefrontal, posterior parietal, limbic.',1),
  so('level','Posterior parietal cortex','assoc','Association cortex.'),
  so('level','Limbic association cortex','assoc','Association cortex.'),
  so('level','Premotor cortex','motor','Motor cortex.',1),
  so('level','Supplementary motor area','motor','Motor cortex.'),
  so('level','Primary motor cortex (pyramidal cells)','motor','Motor cortex.'),
  so('level','LMNs for head and neck muscles','bs','Brainstem.',1),
  so('level','UMNs for automatic movements like breathing','bs','"Some upper motor neurons" are in the brainstem.'),
  so('level','γ motor neurons','sc','Spinal cord.'),
  so('level','Muscle sensory receptors for spinal reflexes','sc','Spinal cord level.'),
  mt('Match each level to its role in her company analogy.',[['Association cortex','CEO'],['Motor cortex','Managers'],['Brainstem and spinal cord','Programmers / salespeople']],'Her command chain analogy.',1),
  mt('Match each level to the question it answers.',[['Association cortex','What should I do right now?'],['Motor cortex','Exactly what should I do to reach the goal?'],['Brainstem / spinal cord','Execute it']],'From her notes table.'),
  mc('Jeff decided to run a triathlon. Which brain region is responsible for making that decision?',['Association cortex','Premotor cortex','Primary motor cortex','Supplementary motor area'],'iClicker: "obviously association cortex, so we are talking about decision making." The other three are motor cortex, which only translates the plan.',1),
  mc('Brainstem LMNs mostly serve muscles ___; spinal cord LMNs mostly serve muscles ___.',['above the shoulder; below the shoulder','below the shoulder; above the shoulder','of the trunk; of the face','of the eye only; of the gut'],'Notes: brainstem LMNs → above the shoulder; spinal LMNs (the majority) → below.'),
  mc('Where does proprioceptive information enter before it ascends to the brain?',['The spinal cord','The prefrontal cortex','The SMA','The cerebellum only'],'Notes: proprioceptive info enters the spinal cord and ascends.'),
  mc('Which is the best summary of how movement is controlled?',['Multiple levels work together in a command chain','One spot in M1 controls all movement','The spinal cord decides and the brain obeys','Each muscle has its own private cortex'],'"No single spot controls movement."'),
  tr('Jeff decides to run a triathlon. A student picks "premotor cortex" because premotor "evaluates correct/incorrect output." What is the trap?',['Evaluating output is part of implementing a plan; deciding what to do at all is association cortex','Premotor is correct','Premotor is part of the association cortex','Evaluating output is a spinal reflex'],'Association cortex = what should I do right now. Motor cortex (including premotor) = exactly how to do it.',1),
  tr('Which statement about the brainstem is TRUE?',['It holds LMNs for head and neck muscles AND some UMNs','It holds only LMNs','It holds only UMNs','It plans the temporal sequence of movement'],'Trap: the brainstem has both. LMNs for head and neck, plus some UMNs for automatic movements like breathing.',1),
  tr('γ motor neurons belong to which level of the hierarchy?',['Spinal cord ("nuts and bolts")','Motor cortex','Association cortex','Brainstem only'],'Slide 7: spinal cord level holds α MNs, γ MNs and muscle sensory receptors.'),
  tr('Which motor cortex area transforms kinematic information into dynamic information?',['Supplementary motor area','Premotor cortex','Primary motor cortex','Posterior parietal cortex'],'Trap: easy to give this to M1. Slide 7 lists it under SMA, with planning the temporal sequence.'),

  tr('Which are TRUE? I. Brain lesions of the LCST cause contralateral weakness. II. Spinal cord lesions of the LCST cause ipsilateral weakness. III. The corticobulbar tract synapses on spinal cord LMNs. IV. The tongue can be weak after a corticobulbar UMN lesion.',['I, II, and IV','I and II','I, II, and III','All of the above'],'III: corticobulbar ends on brainstem cranial nerve nuclei.',1),
  tr('True or False: A left-sided corticobulbar UMN lesion causes weakness of the whole left side of the face, including the forehead.',['False','True'],'Two traps: the lower face weakness is on the OPPOSITE side (applied from the crossed corticobulbar pattern, not stated on the slide), and the forehead is spared (bilateral input). The slide point is: lower face + tongue weakness, upper face spared.',1),
]);

STAGE('Sensing the Body', 'Proprioceptors and spindle structure (slides 25 and 26)', 'Sense', [
  mc('Proprioception is the sense of:',['Body position, movement, and force','Pain and temperature','Taste and smell','Blood pressure'],'Slide 25.'),
  mt('Match each receptor to what it detects.',[['Muscle spindle','Muscle length & stretch'],['Golgi tendon organ','Muscle tension'],['Joint receptor','Joint angle & pressure'],['Vestibular receptor','Head position & acceleration']],'Slide 25 table.',1),
  mc('Which receptor signals joint position especially at the extremes?',['Joint receptors','Muscle spindles','Golgi tendon organs','Vestibular receptors'],'Slide 25.'),
  mc('Which receptor regulates force and prevents overload?',['Golgi tendon organs','Muscle spindles','Cutaneous mechanoreceptors','Joint receptors'],'GTOs at the muscle–tendon junction sense tension.',1),
  mc('The two items in the slide 25 "Function summary" are:',['Position awareness and movement monitoring (real-time feedback)','Volition and adaptability','Force and speed','Excitation and inhibition'],'Function summary.'),
  mc('What are the two functions of the muscle spindle (slide 26)?',['Provide proprioceptive info and form the stretch reflex circuit','Generate force and store Ca²⁺','Sense pain and temperature','Release ACh and break it down'],'The reflex prevents overstretching and fast stretching.',1),
  mc('The spindle sits ___ with the extrafusal fibers, so it stretches when the muscle stretches.',['in parallel','in series','at the tendon only','outside the muscle'],'Notes: embedded between fascicles, in parallel.'),

  so('fiber','Center is non-contractile: no sarcomeres, packed with nuclei','in','Intrafusal center.',1),
  so('fiber','Wrapped by spiral (annulospiral) sensory endings','in','Intrafusal.'),
  so('fiber','Innervated by α motor neurons','ex','Extrafusal.',1),
  so('fiber','Innervated by γ motor neurons, at its two ends only','in','Intrafusal.',1),
  so('fiber','Enclosed in a connective tissue capsule','in','Intrafusal fibers live inside the spindle capsule.'),

  so('aff','Most sensitive to rapid stretch','ia','Rate of change.'),
  so('aff','Responds more to sustained stretch','ii','Type II = length only.'),
  mc('What do γ motor neurons do for the spindle?',['Slightly contract intrafusal fibers so the spindle stays taut','Contract extrafusal fibers to move the joint','Carry stretch info to the cord','Inhibit the antagonist'],'Keep the spindle tense, not slack.',1),
  mc('Alpha-gamma co-activation means the UMN:',['Sends contraction signals to α and γ MNs at the same time','Fires α first, then γ an hour later','Fires only γ during movement','Inhibits γ while α fires'],'So the intrafusal fibers sync to the muscle\'s length. "Very important."',1),
  mc('Without alpha-gamma co-activation, what happens when the muscle shortens?',['The spindle goes slack and stops reporting length','The spindle fires faster than ever','The muscle cannot shorten','The GTO takes over length sensing'],'No info during contraction.',1),
  mc('Her analogy for the spindle is:',['A little ruler on the extrafusal fiber','A thermostat','A speedometer only','A fuse box'],'It changes length with the muscle and keeps reporting.'),
  tr('A muscle is stretched slowly and held. Which afferent keeps firing best?',['Type II (length only, sustained stretch)','Type Ia only','γ motor neuron','α motor neuron'],'Both sense length, but Ia is the rate (speed) detector. Type II responds more to sustained stretch.',1),
  tr('Which afferent is the ONLY one that reports the speed of stretch?',['Type Ia','Type II','Both','Neither'],'Slide 26: rate of length change = type I only.',1),
  tr('Trap: "γ motor neurons carry stretch information from the spindle to the spinal cord." What is wrong?',['γ MNs are motor (efferent): they contract intrafusal ends. Ia and II carry the sensory info','Nothing','γ MNs go to the brain','γ MNs innervate extrafusal fibers'],'Motor vs sensory confusion is a classic trap.',1),
  tr('Which part of an intrafusal fiber contracts?',['Only its two ends','Only its center','The whole fiber equally','None of it'],'Center: non-contractile, no sarcomeres, wrapped by sensory endings. Ends: contractile, innervated by γ.',1),
  tr('Without γ activity, the muscle shortens. Why does the spindle stop reporting?',['The intrafusal fibers go slack, so the spiral endings are no longer stretched','The Ia afferent dies','The extrafusal fibers stop contracting','The GTO inhibits the spindle'],'That is why alpha-gamma co-activation matters.',1),
  tr('During alpha-gamma co-activation, the α and γ signals are sent:',['At the same time, so the spindle\'s length follows the muscle','α first, γ only after the movement ends','γ only, α only at rest','To the same muscle fibers'],'Same time, same strength, so the intrafusal fibers sync to the muscle\'s length.',1),
  tr('Spindle vs Golgi tendon organ: which senses TENSION?',['Golgi tendon organ','Muscle spindle','Both equally','Neither'],'Spindle = length and stretch; GTO = tension (force).',1),
  tr('The spindle sits in parallel with extrafusal fibers. Why does that matter?',['When the whole muscle stretches, the spindle stretches too','It makes the spindle generate force','It lets the spindle sense tension in the tendon','It makes it insensitive to stretch'],'Notes: in parallel → spindle stretches when the muscle stretches.'),
  tr('Which receptor is most important for balance by sensing head position and acceleration?',['Vestibular receptors','Joint receptors','Golgi tendon organs','Muscle spindles'],'Inner ear.'),
  tr('Which receptor mostly signals joint position at the EXTREMES of motion?',['Joint receptors','Muscle spindles','Cutaneous mechanoreceptors','Vestibular receptors'],'Slide 25.'),
  tr('Which are TRUE about the muscle spindle? I. Type Ia and II afferents both sense muscle length. II. Only Type II senses the rate of stretch. III. γ MNs innervate the two ends of intrafusal fibers. IV. The center of the intrafusal fiber is contractile.',['I and III','I, II, and III','I, III, and IV','All of the above'],'II: rate = Type I only. IV: the center is non-contractile.',1),
  tr('A student recalls: 1. "Alpha-gamma co-activation keeps the spindle from going slack during contraction." 2. "γ motor neurons generate the force that moves the joint." Which is accurate?',['Statement 1 is accurate; statement 2 is not, α MNs to extrafusal fibers generate force','Both are accurate','Statement 2 is accurate; statement 1 is not','Neither is accurate'],'γ contraction is slight and only keeps the spindle taut.',1),
  tr('A drug selectively blocks γ motor neurons while a person slowly lifts a weight. What best describes the effect?',['The muscle still contracts, but the spindle goes slack and stops reporting length during the lift','The muscle cannot contract at all','The spindle fires more than usual','The Golgi tendon organ stops working'],'α drive is intact; without γ, no co-activation. (Drug case applied.)',1),
  tr('Which statement is FALSE?',['Golgi tendon organs sense muscle length','Muscle spindles sense muscle length and stretch','Joint receptors signal joint position, especially at extremes','Vestibular receptors sense head position and acceleration'],'GTOs sense tension, not length.',1),
]);

STAGE('The Knee Jerk', 'Patellar reflex: trace the circuit in words (slide 27)', 'Reflex', [
  od('Put the patellar reflex in order.',['Tap the patellar tendon','Quadriceps suddenly stretched','Type Ia afferents fire','Ia excites α MN of quadriceps and an inhibitory interneuron','Quadriceps contract, hamstrings relax'],'Slide 27, all within milliseconds. Be able to draw this.',1),
  mc('In the stretch reflex, the Ia afferent synapses on the α MN of the homonymous muscle. That synapse is:',['Direct and excitatory','Through an interneuron and inhibitory','Direct and inhibitory','Electrical'],'Response 1: stretch reflex.',1),
  mc('Reciprocal inhibition makes the antagonist:',['Relax, via an inhibitory interneuron','Contract harder','Stretch the spindle','Lose its tone permanently'],'Response 2.',1),
  mc('The two-fold response happens to strong Ia signals during:',['Fast stretch','Slow sustained stretch','Rest','Sleep'],'"during fast stretch" is highlighted on slide 27.'),
  mc('In the knee jerk, the homonymous muscle is the ___ and the antagonist is the ___.',['quadriceps; hamstrings','hamstrings; quadriceps','gastrocnemius; tibialis','biceps; triceps'],'Quadriceps (extensors) stretched; flexors inhibited.'),
  mc('How does she tell you to answer any spindle or tone question?',['Reproduce the neural circuit','Memorize the receptor table only','Guess the most proximal neuron','Use the Nernst equation'],'"Reproduce this neural circuit to answer any muscle spindle related or muscle toning related questions."',1),
  tr('Trace the stretch reflex in words. Which sequence is correct?',['Spindle in quadriceps → Ia afferent (cell body in dorsal root ganglion) → α MN of quadriceps → quadriceps contract','Spindle → Ia → inhibitory interneuron → α MN of quadriceps → quadriceps contract','Spindle → Ia → UMN in cortex → α MN → quadriceps contract','Golgi tendon organ → Ib → α MN of quadriceps → quadriceps contract'],'Stretch reflex = direct (monosynaptic) excitatory Ia → α MN of the homonymous muscle. The interneuron belongs to the OTHER arm (reciprocal inhibition).',1),
  tr('Trace reciprocal inhibition in words. Which sequence is correct?',['Ia afferent → inhibitory interneuron → α MN of the hamstrings → hamstrings relax','Ia afferent → α MN of the hamstrings directly → hamstrings relax','Ia afferent → excitatory interneuron → α MN of the hamstrings → hamstrings contract','γ MN → inhibitory interneuron → quadriceps relax'],'Response 2 on slide 27: the antagonist group relaxes through an inhibitory interneuron.',1),
  tr('In the reflex circuit, where do the sensory neuron and the motor neurons meet?',['Gray matter of the spinal cord','White matter of the spinal cord','Dorsal root ganglion','Primary motor cortex'],'The Ia cell body sits in the dorsal root ganglion; its synapses with the interneuron and α MNs are in the gray matter.'),
  tr('Which neuron in the knee-jerk circuit has its cell body OUTSIDE the spinal cord?',['The Ia sensory neuron (dorsal root ganglion)','The α MN of the quadriceps','The inhibitory interneuron','The α MN of the hamstrings'],'Sensory cell bodies are in the dorsal root ganglion; motor neurons and interneurons are in the cord.'),
  tr('Which statement about the "+" and "−" in the reflex circuit is TRUE?',['"+" is the Ia → quadriceps α MN synapse; "−" is the interneuron → hamstring α MN synapse','"+" and "−" are both made by the Ia afferent onto α MNs','"−" is on the quadriceps α MN','"+" is between the UMN and the α MN'],'Slide 27 marks excitation onto the homonymous MN and inhibition onto the antagonist MN.',1),
  tr('Which muscle is the homonymous muscle in the knee jerk?',['Quadriceps (extensors): the one that was stretched','Hamstrings (flexors)','Gastrocnemius','Tibialis anterior'],'Homonymous = the stretched muscle whose spindle fired.'),
  tr('How many neuron types do you need to draw the full knee-jerk circuit (both responses)?',['Three: Ia sensory neuron, α motor neurons (quadriceps and hamstrings), inhibitory interneuron','Two: sensory and motor only','One: the Ia afferent','Four, including the UMN'],'Sensory (blue), motor (red), interneuron (green) on slide 27. The UMN is not needed for the reflex.'),
]);

STAGE('Tone and Circuit Traps', 'Muscle toning (slides 28 to 30) plus reflex and tone cases', 'Tone', [
  mc('Muscle tone is:',['The tension maintained in a resting muscle','Maximal voluntary force','The speed of contraction','The size of the muscle'],'Slide 28.',1),
  mt('Match each function of muscle tone to its detail.',[['Resist passive stretching','Prevents structural damage, with titin'],['Keep sarcomeres ready','Appropriate thick/thin overlap → quick force'],['Stabilize joints','Posture, head upright, knees don\'t buckle']],'Slide 28.',1),
  od('Put the muscle toning circuit in order.',['CNS (brainstem and cortex) stimulates γ MN','Ends of intrafusal fibers contract','Middle of intrafusal fibers stretched fast','Type I sensory neuron fires','α MN activated','Extrafusal fibers contract → tone'],'Slide 29. Be able to draw it.',1),
  mc('Where do γ MNs get their regular tone input from (slide 29)?',['The CNS: brainstem and cortex','The Golgi tendon organ','The vestibular receptors only','The α MN'],'Her caveat: the exact source is "not exactly sure"; the slide lists brainstem and cortex.'),
  mc('Can γ-driven intrafusal contraction move the muscle by itself?',['No, it is too weak','Yes, it is the main source of force','Only in the leg','Only during sleep'],'Notes: "too weak to move the muscle."'),
  mc('Jeff\'s spinal cord was traumatized at the lumbar region. He cannot move his legs but keeps his muscle tone. Which is most likely damaged?',['Upper motor neuron','Type I and II sensory neuron','Gamma motor neuron','Alpha (lower) motor neuron'],'iClicker: tone intact means the γ → Ia → α circuit works. Only the UMN (voluntary drive) is lost.',1),
  mc('In Jeff\'s case, why can\'t the α motor neuron be the damaged one?',['α MNs are part of the tone circuit, and tone is intact','α MNs are only in the brain','α MNs only control the face','α MNs are sensory'],'Tone needs α MNs to contract extrafusal fibers.'),
  mc('Damage to the Ia afferents of the quadriceps would most likely:',['Abolish the knee-jerk reflex and reduce tone in that muscle','Increase the knee-jerk reflex','Have no effect on reflex or tone','Paralyze the face'],'Ia is in both the reflex and the tone circuit. (Not on the slides: applied reasoning from the circuit.)'),
  tr('In reciprocal inhibition, the Ia afferent synapses on the inhibitory interneuron. Is THAT synapse excitatory or inhibitory?',['Excitatory: Ia excites the interneuron, and the interneuron inhibits the antagonist α MN','Inhibitory: Ia inhibits the interneuron','Ia directly inhibits the antagonist','There is no interneuron'],'Trap. Sensory afferents excite; the inhibition comes from the interneuron. (The Ia → interneuron sign is applied from the circuit; the slide marks + on the homonymous MN and − on the antagonist side.)',1),
  tr('The stretch reflex arc from Ia to the quadriceps α MN has how many synapses in the cord?',['One: it is direct','Two, through an interneuron','Three','None'],'Response 1 is a direct excitatory synapse. Only the reciprocal inhibition path uses an interneuron.',1),
  tr('A slow, gentle stretch of the quadriceps produces a much weaker reflex than a sharp tendon tap. Why?',['The two-fold response needs strong Ia signals, which come from FAST stretch','Slow stretch activates the GTO instead','Slow stretch blocks the α MN','Slow stretch has no effect on the spindle'],'Slide 27: strong type Ia signals during fast stretch.',1),
  tr('In the knee jerk, what happens to the hamstrings?',['They relax, through reciprocal inhibition','They contract with the quadriceps','They are stretched and fire Ia','Nothing'],'Antagonistic muscle group will relax.'),
  tr('Where is the cell body of the Ia sensory neuron?',['Dorsal root ganglion','Ventral horn','Primary motor cortex','In the muscle spindle'],'Slide 27 label.'),
  tr('Trap: "Muscle tone is produced by UMNs telling the α MNs to fire a little all the time." Per the slide 29 circuit, what actually drives tone?',['CNS input to γ MNs → intrafusal ends contract → Ia fires → α MN → extrafusal contraction','UMNs directly to α MNs','The Golgi tendon organ','Titin only'],'The UMN drives voluntary movement; tone comes through the γ → spindle → α loop.',1),
  tr('Jeff cannot move his legs but has normal tone. A student picks "gamma motor neuron." Why is that wrong?',['If γ were damaged, the tone loop would break and tone would drop','γ MNs are in the brain','γ MNs only control the face','γ MNs control voluntary movement'],'Tone intact → γ, Ia/II, and α all work. Only the UMN is out.',1),
  tr('Which lesion would abolish BOTH voluntary movement AND tone in a leg muscle?',['The α (lower) motor neuron to that muscle','The UMN only','The γ motor neuron only','The SMA'],'α MN is the final common path for both voluntary movement and the tone loop. (Applied from the circuit.)',1),
  tr('Which lesion would reduce tone but leave voluntary movement possible?',['The γ motor neurons (or the Ia afferents) for that muscle','The UMN','The α motor neuron','The primary motor cortex'],'Breaks the tone loop but the UMN → α path still works. (Applied from the circuit.)',1),
  tr('Why is a muscle "never completely relaxed"?',['Low-level neural contraction (tone) keeps some tension at rest','Titin contracts on its own','The SMA fires continuously','Sarcomeres lock in place'],'Tone = tension maintained in a resting muscle.'),
  tr('A maximally stretched sarcomere produces little force because:',['Thick and thin filaments barely overlap, so few cross bridges form','Too many cross bridges form','Ca²⁺ cannot enter','The spindle inhibits it'],'Slide 28: tone keeps sarcomeres at appropriate overlap for quick force.',1),
  tr('Besides titin, what helps a resting muscle resist passive stretching?',['Low-level neural contraction (tone), helped by the stretch reflex','Golgi tendon organs contracting','Vestibular receptors','Bone'],'Notes on tone function 1.'),
  tr('The intrafusal contraction caused by γ MNs during toning is:',['Too weak to move the muscle; it only stretches the spindle center','Strong enough to move the joint','The main force of the muscle','Inhibitory'],'Notes.'),
  tr('A drug blocks the inhibitory interneurons in the spinal cord. The patellar tendon is tapped. What best describes the result?',['The quadriceps still contract, but the hamstrings are no longer inhibited','No reflex at all','The hamstrings contract and the quadriceps relax','The quadriceps lose tone permanently'],'Stretch reflex is direct (no interneuron); reciprocal inhibition needs the interneuron. (Drug case applied.)',1),
  tr('A student recalls: 1. "In the stretch reflex, Ia afferents excite the α MN of the homonymous muscle directly." 2. "Muscle tone is produced by the UMN firing the α MN continuously." Which best describes these statements?',['Statement 1 is accurate; statement 2 is not, tone comes from CNS input to γ MNs through the spindle loop','Both are accurate','Statement 2 is accurate; statement 1 is not','Neither is accurate'],'Slide 27 vs slide 29.',1),
  tr('Which are TRUE? I. Muscle tone keeps sarcomeres at good thick/thin overlap. II. The reflex response is strongest during slow stretch. III. In the toning circuit, Type I sensory neurons activate α MNs. IV. Tone helps stabilize joints.',['I, III, and IV','I and IV','I, II, and IV','All of the above'],'II: the two-fold response needs fast stretch.',1),
  tr('A patient\'s leg muscles are floppy (no tone) and he cannot move them voluntarily; his knee-jerk is absent. Which single damaged structure explains ALL three findings?',['α (lower) motor neurons to the leg','Upper motor neurons','γ motor neurons only','The SMA'],'α MN is shared by voluntary movement, reflex and tone. Compare with Jeff, where only the UMN was lost. (Applied.)',1),
  tr('True or False: In the patellar reflex, the antagonist (hamstrings) relaxes because the Ia afferent directly inhibits its α motor neuron.',['False','True'],'Ia afferents do not directly inhibit. They act through an inhibitory interneuron.',1),
  tr('Which is NOT part of the muscle toning circuit on slide 29?',['UMN firing the α MN','CNS input to the γ MN','Contraction of the intrafusal fiber ends','Type I sensory neuron activating α MNs'],'The UMN is drawn as a separate input for voluntary movement. That separation is why Jeff keeps his tone.',1),
  tr('In the toning circuit, which TWO inputs are drawn separately on slide 29?',['Input from the CNS (to γ MN) and the upper motor neuron (to α MN)','Ia afferent and Type II afferent','GTO and joint receptor','SMA and premotor cortex'],'That separation is the whole logic of the Jeff question.',1),
  tr('Number the toning steps correctly. Step 2 is:',['The fast-stretched middle of the intrafusal fiber activates the Type I sensory neuron','γ MN fires and the intrafusal ends contract','α MN fires and extrafusal fibers contract','The UMN fires for voluntary movement'],'Step 1 γ, step 2 Type I sensory, step 3 α → tone.',1),
  tr('In the toning circuit, the γ motor neuron axon goes to ___ and the α motor neuron axon goes to ___.',['the ends of intrafusal fibers; extrafusal fibers','extrafusal fibers; intrafusal fibers','the Ia afferent; the dorsal root ganglion','the cortex; the brainstem'],'γ fibers → spindle ends; α fiber → extrafusal fibers.',1),
  tr('In the toning circuit, the Ia fiber travels:',['From the spindle into the spinal cord (dorsal side) to excite the α MN','From the α MN to the spindle','From the cortex to the γ MN','From the extrafusal fiber to the tendon'],'Afferent: spindle → cord → α MN (the spindle reflex circuit).'),
]);

</script>
<script>
const KEY='l14climb_v1';
const store = { get(){ try{ return JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){ return {}; } },
  set(v){ try{ localStorage.setItem(KEY, JSON.stringify(v)); }catch(e){} } };
let SAVE = Object.assign({stars:{}, miss:[], best:0, theme:null}, store.get());
if (SAVE.theme) document.documentElement.setAttribute('data-theme', SAVE.theme);
const ALL = STAGES.flatMap(s=>s.items);
const byId = Object.fromEntries(ALL.map(i=>[i.id,i]));
const app = document.getElementById('app');
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const starHTML = n => '<i>'+'★'.repeat(n)+'</i>'+'★'.repeat(3-n);

/* ---------- home ---------- */
function home(){
  // Stage map: a descending pathway, cortex (top) to muscle (bottom); stops numbered in study order
  const P=[[46,166],[96,40],[150,56],[202,72],[252,86],[300,99],[346,112],[392,128],[436,147],[480,170]];
  const curve = 'M46,166 C46,90 70,40 96,40 C125,40 135,51 150,56 C175,64 188,68 202,72 C225,79 238,82 252,86 C275,92 288,96 300,99 C322,105 335,108 346,112 C368,119 380,123 392,128 C412,136 425,142 436,147 C455,156 468,163 480,170';
  const dots = STAGES.map((s,i)=>{const [x,y]=P[i]; const done=(SAVE.stars[i]||0)===3; return `<g class="dot${done?' done':''}" data-stage="${i}" role="button" tabindex="0" aria-label="Stage ${i+1}: ${esc(s.name)}"><circle cx="${x}" cy="${y}" r="11"></circle><text x="${x}" y="${y}">${i+1}</text></g>`;}).join('');
  const missN = SAVE.miss.filter(id=>byId[id]).length;
  const trapN = ALL.filter(i=>i.trap).length;
  const hyN = ALL.filter(i=>i.hy).length;
  app.innerHTML = `
  <div class="top"><span class="eyebrow">A&amp;P · Lecture 14</span><button class="ghost" id="theme">${themeLabel()}</button></div>
  <div class="hero"><h1>Motor Control Climb</h1><p>Ten stops down the somatic motor system: from why movement needs a boss, through the cortex and the tracts, to the spindle reflex and muscle tone. Built for how she tests: clinical cases, "which statements are true," and close-but-wrong distractors. No diagram questions: the circuits she wants you to draw are tested in words.</p></div>
  <div class="trace" aria-label="Stage map drawn as a descending motor pathway">
    <svg viewBox="0 0 510 200" role="img">
      <line class="grid" x1="10" y1="182" x2="500" y2="182"></line>
      <text class="ax" x="96" y="20">cortex (plan)</text><text class="ax" x="300" y="78">tracts</text><text class="ax" x="430" y="196">muscle</text><text class="ax" x="14" y="196">why</text>
      <path class="curve" d="${curve}"></path>${dots}
    </svg>
  </div>
  <div class="modes">
    <button class="mode" data-mode="hy"><b>High-Yield Run</b><span>${hyN} starred items, shuffled</span></button>
    <button class="mode" data-mode="miss" ${missN?'':'disabled'}><b>Your Misses</b><span>${missN?missN+' to clear':'Nothing missed yet'}</span></button>
    <button class="mode" data-mode="trap"><b>Trap Run</b><span>${trapN} trap, case and statement questions</span></button>
    <button class="mode" data-mode="mix"><b>Mixed 20</b><span>20 random from every stage</span></button>
  </div>
  <div class="eyebrow" style="margin-bottom:8px">Stages · ${ALL.length} questions</div>
  <div class="stages">${STAGES.map((s,i)=>`<button class="stage" data-stage="${i}"><span class="mv">${s.mv}</span><span><h3>${i+1}. ${esc(s.name)}</h3><small>${esc(s.sub)} · ${s.items.length} Qs</small></span><span class="stars">${starHTML(SAVE.stars[i]||0)}</span></button>`).join('')}</div>
  <p class="foot">Stars count first-try accuracy: 90% for three, 75% for two, 50% for one. Anything you miss comes back at the end of the run until you get it, and lands in Your Misses.</p>`;
  app.querySelectorAll('[data-stage]').forEach(b=>{ const go=()=>startRun('stage',+b.dataset.stage); b.addEventListener('click',go); b.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();go();} }); });
  app.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>startRun(b.dataset.mode)));
  document.getElementById('theme').onclick = toggleTheme;
  // stages list top = last stage climbs upward visually? keep order 1..8 for reading.
}
function themeLabel(){ const t=document.documentElement.getAttribute('data-theme'); return t==='dark'?'Dark':t==='light'?'Light':'Auto'; }
function toggleTheme(){ const r=document.documentElement; const t=r.getAttribute('data-theme'); const n = t===null?'dark':t==='dark'?'light':null; if(n) r.setAttribute('data-theme',n); else r.removeAttribute('data-theme'); SAVE.theme=n; store.set(SAVE); document.getElementById('theme').textContent=themeLabel(); }

/* ---------- run ---------- */
let R=null;
function startRun(mode, stage){
  let items, title;
  if(mode==='stage'){ items = STAGES[stage].items.slice(); title = (stage+1)+'. '+STAGES[stage].name; }
  else if(mode==='hy'){ items = shuffle(ALL.filter(i=>i.hy)); title='High-Yield Run'; }
  else if(mode==='miss'){ items = shuffle(SAVE.miss.map(id=>byId[id]).filter(Boolean)); title='Your Misses'; }
  else if(mode==='trap'){ items = shuffle(ALL.filter(i=>i.trap)); title='Trap Run'; }
  else { items = shuffle(ALL).slice(0,20); title='Mixed 20'; }
  R = {mode, stage, title, queue: items.map(it=>({it, retry:false})), total: items.length, firstRight:0, firstDone:0, score:0, streak:0, missed:[], pos:0};
  renderItem();
}
function mult(){ return Math.min(4, 1+Math.floor(R.streak/3)); }
function hud(){
  const done = R.firstDone; const pct = Math.round(100*done/R.total);
  return `<div class="hud"><div class="hudrow"><button class="ghost" id="quit">← Map</button><span>${esc(R.title)}</span><span>${R.score} pts <span class="mult">×${mult()}</span></span></div>
  <div class="bar"><i style="width:${pct}%"></i></div><div class="hudrow"><span>${Math.min(done+1,R.total)} / ${R.total}${R.queue[R.pos]&&R.queue[R.pos].retry?' · retry':''}</span><span>streak ${R.streak}</span></div></div>`;
}
function figHTML(key, item){
  const d = DIA[key]; if(!d) return '';
  const mask = d.mask!==false;
  let boxes = '';
  if(item && (item.t==='lb'||item.t==='nm')){
    let tIdx = -1;
    if(item.t==='nm'){ let k=0; d.b.forEach((b,i)=>{ if(b[4]===item.name){ if(k===item.idx) tIdx=i; k++; } }); }
    boxes = d.b.map((b,i)=>{
      const cls = item.t==='lb' ? 'box tap' : (i===tIdx ? 'box target' : 'box');
      if(!mask && item.t==='nm' && i!==tIdx) return '';
      const tag = item.t==='lb' ? 'button' : 'div';
      return `<${tag} class="${cls}" data-bi="${i}" data-name="${esc(b[4])}" style="left:${b[0]}%;top:${b[1]}%;width:${b[2]}%;height:${b[3]}%" ${item.t==='lb'?'aria-label="covered label"':''}></${tag}>`;
    }).join('');
  }
  return `<div class="fig ${mask?'':'nomask'}"><img src="${d.img}" alt="${esc(d.title)}">${boxes}</div><div class="figcap">${esc(d.title)}</div>`;
}
function renderItem(){
  if(R.pos>=R.queue.length) return finish();
  const {it, retry} = R.queue[R.pos];
  const typeName = {mc:'Multiple choice',so:'Sort',od:'Order',mt:'Match',lb:'Tap the label',nm:'Name the box'}[it.t];
  let body = '';
  const tag = `<div class="tag">${typeName}${it.trap?' <span class="hy">trap</span>':''}${it.hy?' <span class="hy">high yield</span>':''}${retry?' · second chance':''}</div>`;
  if(it.t==='mc'){
    const opts = shuffle(it.o);
    body = (it.ctx?`<div class="ctx">${esc(it.ctx)}</div>`:'') + (it.img?figHTML(it.img):'') + `<p class="q">${esc(it.q)}</p><div class="opts">${opts.map(o=>`<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
  } else if(it.t==='so'){
    const S = SORTS[it.set];
    body = `<p class="q">${esc(S.label)}</p><div class="sortitem">${esc(it.item)}</div><div class="cats">${S.cats.map(c=>`<button class="cat" data-key="${c[0]}" style="--cc:var(${c[2]})">${esc(c[1])}</button>`).join('')}</div>`;
  } else if(it.t==='od'){
    body = `<p class="q">${esc(it.q)}</p><div class="seq" id="seq"></div><div class="chips">${shuffle(it.steps).map(s=>`<button class="chip" data-v="${esc(s)}">${esc(s)}</button>`).join('')}</div><div class="actions"><button class="ghostbtn" id="undo">Undo</button></div>`;
  } else if(it.t==='mt'){
    body = `<p class="q">${esc(it.q)}</p><div class="mtgrid"><div class="mtcol">${it.pairs.map(p=>`<button class="mtb L" data-v="${esc(p[0])}">${esc(p[0])}</button>`).join('')}</div><div class="mtcol">${shuffle(it.pairs.map(p=>p[1])).map(v=>`<button class="mtb Rr" data-v="${esc(v)}">${esc(v)}</button>`).join('')}</div></div>`;
  } else if(it.t==='lb'){
    body = `<p class="q">Tap the covered label: <span style="color:var(--accent)">${esc(it.name)}</span></p>` + figHTML(it.dia,it);
  } else if(it.t==='nm'){
    const d=DIA[it.dia];
    let opts;
    if(it.o) opts = it.o.slice();
    else { const names=[...new Set(d.b.map(b=>b[4]))].filter(n=>n!==it.name); opts=[it.ans, ...shuffle(names).slice(0,3)]; }
    body = figHTML(it.dia,it) + `<p class="q">${esc(it.q||'Name the label in the orange box.')}</p><div class="opts">${shuffle(opts).map(o=>`<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
  }
  app.innerHTML = hud() + `<div class="card" id="card">${tag}${body}<div id="fb"></div></div>`;
  document.getElementById('quit').onclick = ()=>{ R=null; home(); };
  wire(it);
  window.scrollTo(0,0);
}
function wire(it){
  const card = document.getElementById('card');
  if(it.t==='mc' || it.t==='nm'){
    const right = it.t==='mc' ? it.o[0] : it.ans;
    card.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const ok = b.dataset.v===right;
      card.querySelectorAll('.opt').forEach(x=>{ x.disabled=true; if(x.dataset.v===right) x.classList.add('right'); });
      if(!ok) b.classList.add('wrong');
      if(it.t==='nm'){ const t=card.querySelector('.box.target'); if(t){ t.classList.add('right'); } }
      answer(ok, it.t==='nm' && !ok ? 'It was: '+it.ans : (ok?'':'Answer: '+right));
    });
  } else if(it.t==='so'){
    card.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{
      const ok = b.dataset.key===it.key;
      card.querySelectorAll('.cat').forEach(x=>{ x.disabled=true; if(x.dataset.key===it.key) x.classList.add('right'); });
      if(!ok) b.classList.add('wrong');
      const S=SORTS[it.set]; answer(ok, ok?'':'Answer: '+S.cats.find(c=>c[0]===it.key)[1]);
    });
  } else if(it.t==='lb'){
    card.querySelectorAll('.box.tap').forEach(b=>b.onclick=()=>{
      if(card.dataset.done) return; card.dataset.done=1;
      const ok = b.dataset.name===it.name;
      card.querySelectorAll('.box.tap').forEach(x=>{ x.disabled=true; if(x.dataset.name===it.name) x.classList.add('right'); });
      if(!ok) b.classList.add('wrong');
      answer(ok, ok?'':'The green outline shows where it is.');
    });
  } else if(it.t==='od'){
    const seq=[]; const seqEl=document.getElementById('seq');
    const draw=()=>{ seqEl.innerHTML = seq.map((s,i)=>`<div class="slot"><span>${i+1}</span><span>${esc(s)}</span></div>`).join(''); };
    card.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
      seq.push(b.dataset.v); b.disabled=true; draw();
      if(seq.length===it.steps.length){
        const ok = seq.every((s,i)=>s===it.steps[i]);
        seqEl.querySelectorAll('.slot').forEach((el,i)=>{ if(seq[i]!==it.steps[i]) el.classList.add('wrong'); });
        document.getElementById('undo').disabled=true;
        answer(ok, ok?'':'Correct order: '+it.steps.map((s,i)=>(i+1)+') '+s).join('  '));
      }
    });
    document.getElementById('undo').onclick=()=>{ const v=seq.pop(); if(v==null) return; const c=[...card.querySelectorAll('.chip')].find(x=>x.dataset.v===v&&x.disabled); if(c) c.disabled=false; draw(); };
  } else if(it.t==='mt'){
    let selL=null; const made={};
    const L=[...card.querySelectorAll('.mtb.L')], Rr=[...card.querySelectorAll('.mtb.Rr')];
    L.forEach(b=>b.onclick=()=>{ if(b.classList.contains('paired')) return; L.forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); selL=b; });
    Rr.forEach(b=>b.onclick=()=>{
      if(!selL || b.classList.contains('paired')) return;
      made[selL.dataset.v]=b.dataset.v; selL.classList.remove('sel'); selL.classList.add('paired'); b.classList.add('paired');
      selL.textContent = selL.dataset.v+' → '+b.dataset.v; selL=null;
      if(Object.keys(made).length===it.pairs.length){
        const ok = it.pairs.every(p=>made[p[0]]===p[1]);
        L.forEach(x=>{ const p=it.pairs.find(p=>p[0]===x.dataset.v); x.classList.add(made[p[0]]===p[1]?'right':'wrong'); });
        answer(ok, ok?'':'Pairs: '+it.pairs.map(p=>p[0]+' → '+p[1]).join(' · '));
      }
    });
  }
}
function answer(ok, extra){
  const q = R.queue[R.pos];
  if(!q.retry){
    R.firstDone++;
    if(ok){ R.firstRight++; }
    else { R.missed.push(q.it.id); if(!SAVE.miss.includes(q.it.id)) SAVE.miss.push(q.it.id); }
  }
  if(ok){ R.score += 10*mult(); R.streak++; if(R.mode==='miss'||q.retry) SAVE.miss = SAVE.miss.filter(id=>id!==q.it.id); }
  else { R.streak=0; R.queue.push({it:q.it, retry:true}); }
  store.set(SAVE);
  const fb = document.getElementById('fb');
  fb.innerHTML = `<div class="fb ${ok?'ok':'no'}"><b>${ok?'Correct':'Not quite'}</b>${extra?esc(extra)+'<br>':''}${esc(q.it.why||'')}</div><button class="next" id="next">${R.pos+1<R.queue.length?'Next':'See results'}</button>`;
  const n=document.getElementById('next'); n.onclick=()=>{ R.pos++; renderItem(); }; n.focus({preventScroll:true});
  fb.scrollIntoView({block:'nearest',behavior:'smooth'});
}
function finish(){
  const acc = R.total? R.firstRight/R.total : 0;
  const st = acc>=0.9?3:acc>=0.75?2:acc>=0.5?1:0;
  if(R.mode==='stage'){ SAVE.stars[R.stage]=Math.max(SAVE.stars[R.stage]||0, st); }
  SAVE.best=Math.max(SAVE.best||0,R.score); store.set(SAVE);
  const missed=[...new Set(R.missed)].map(id=>byId[id]);
  const label = it => it.t==='so'?it.item : (it.t==='lb'||it.t==='nm')? (it.q||'Label')+': '+it.ans : it.q;
  app.innerHTML = `<div class="card result" style="margin-top:18px"><div class="eyebrow">${esc(R.title)}</div><h2>${st===3?'Summit':st===2?'Almost there':st===1?'Halfway up':'Keep climbing'}</h2>
    <div class="big-stars">${starHTML(st)}</div>
    <p class="stat">${R.firstRight}/${R.total} first try (${Math.round(acc*100)}%) · ${R.score} pts · best ${SAVE.best}</p>
    ${missed.length?`<div class="eyebrow" style="margin-top:12px">Missed on first try</div><ul class="misslist">${missed.map(it=>`<li>${esc(label(it))}</li>`).join('')}</ul>`:''}
    <div class="actions" style="margin-top:16px"><button class="next" id="again">Run it again</button><button class="ghostbtn" id="map">Back to map</button></div></div>`;
  document.getElementById('again').onclick=()=>startRun(R.mode,R.stage);
  document.getElementById('map').onclick=()=>{ R=null; home(); };
}
window.GAME = { cur: ()=> R && R.queue[R.pos] ? R.queue[R.pos].it : null, STAGES, DIA, SORTS, startRun, home };
home();
</script>
