<style>
/* Layout: one narrow column; home = a Hebbian network where each stage is a neuron and finished stages wire together, run = card + figure + choices */
:root{
  --bg:#EDF1EE; --panel:#FFFFFF; --panel2:#F6F8F6; --ink:#15201C; --muted:#5A6A64; --line:#CFD9D4;
  --accent:#6A3FA3; --accent-ink:#FFFFFF; --cover:#EE8A22; --cover-dim:#B9C4BF; --ok:#1C8A4B; --bad:#C2372C; --star:#D99A0B;
  --c1:#2F6FB7; --c2:#8A5BB0; --c3:#0C7A63; --c4:#C9821A; --c5:#C4467E;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1513; --panel:#16201D; --panel2:#1B2723; --ink:#E3ECE8; --muted:#93A7A0; --line:#2A3A35;
  --accent:#B993F2; --accent-ink:#1B0D2E; --cover:#F0922E; --cover-dim:#4A5853; --ok:#4FC47D; --bad:#F2695D; --star:#F2B930;
  --c1:#6FA6EA; --c2:#B88BE0; --c3:#43CF9E; --c4:#EAA94A; --c5:#EE7BB0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1513; --panel:#16201D; --panel2:#1B2723; --ink:#E3ECE8; --muted:#93A7A0; --line:#2A3A35;
  --accent:#B993F2; --accent-ink:#1B0D2E; --cover:#F0922E; --cover-dim:#4A5853; --ok:#4FC47D; --bad:#F2695D; --star:#F2B930;
  --c1:#6FA6EA; --c2:#B88BE0; --c3:#43CF9E; --c4:#EAA94A; --c5:#EE7BB0; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;margin:0}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:18px 48px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.box:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px}
.hero h1{font-size:clamp(30px,7vw,46px);font-weight:800;line-height:1.02;letter-spacing:-.01em;margin-top:6px}
.hero p{color:var(--muted);margin:8px 0 0;max-width:60ch}
.trace{margin:18px 0 6px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 6px 4px;overflow:hidden}
.trace svg{display:block;width:100%;height:auto}
.trace .grid{stroke:var(--line);stroke-width:1}
.trace .curve{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:4 4}
.trace .wire{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round}
.trace .faint{stroke:var(--line);stroke-width:1;opacity:.7}
.trace .dot{cursor:pointer}
.trace .dot circle{fill:var(--panel);stroke:var(--accent);stroke-width:2.5}
.trace .dot.done circle{fill:var(--accent)}
.trace .dot text{font-family:var(--mono);font-size:12px;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.trace .dot.done text{fill:var(--accent-ink)}
.trace .ax{font-family:var(--mono);font-size:10px;fill:var(--muted)}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:16px 0 22px}
.mode{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:2px}
.mode b{font-family:var(--display);font-weight:700;font-size:17px}
.mode span{color:var(--muted);font-size:13px}
.mode:disabled{opacity:.45;cursor:default}
.stages{display:flex;flex-direction:column;gap:8px}
.stage{display:grid;grid-template-columns:64px minmax(0,1fr) auto;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;width:100%}
.stage .mv{font-family:var(--mono);font-size:13px;white-space:nowrap;color:var(--accent);font-variant-numeric:tabular-nums}
.stage h3{font-size:18px;font-weight:700}
.stage small{color:var(--muted);display:block;font-size:13px}
.stars{font-size:16px;letter-spacing:2px;color:var(--line);white-space:nowrap}
.stars i{font-style:normal;color:var(--star)}
.foot{color:var(--muted);font-size:13px;margin-top:22px}
/* run */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px;display:flex;flex-direction:column;gap:8px}
.hudrow{display:flex;align-items:center;gap:10px;justify-content:space-between;font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.mult{color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:8px}
.ctx{background:var(--panel2);border-left:3px solid var(--accent);padding:8px 12px;border-radius:6px;margin-bottom:12px;font-size:15px}
.tag{display:inline-flex;gap:6px;align-items:center;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.tag .hy{color:var(--bad);border:1px solid currentColor;border-radius:4px;padding:0 5px}
.q{font-size:18px;font-weight:700;margin:2px 0 12px}
.fig{position:relative;width:100%;margin:4px 0 4px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#fff}
.fig img{display:block;width:100%;height:auto}
.box{position:absolute;border-radius:3px;background:var(--cover-dim);border:0;padding:0}
.box.target{background:var(--cover);box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--cover)}
.box.tap{background:var(--cover);cursor:pointer}
.box.tap:hover{filter:brightness(1.08)}
.nomask .box{background:transparent}
.nomask .box.target{background:color-mix(in srgb,var(--cover) 14%,transparent);box-shadow:none;outline:3px solid var(--cover);outline-offset:-3px}
.box.right{background:transparent!important;outline:3px solid var(--ok);outline-offset:-1px;box-shadow:none}
.box.wrong{background:transparent!important;outline:3px solid var(--bad);outline-offset:-1px;box-shadow:none}
.figcap{font-size:12px;color:var(--muted);margin:2px 0 12px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;background:var(--panel2);border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;font-size:16px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--panel))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--panel))}
.opt:disabled{cursor:default}
.sortitem{font-size:18px;font-weight:700;background:var(--panel2);border:1px dashed var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cat{border:2px solid var(--cc);background:color-mix(in srgb,var(--cc) 10%,var(--panel));border-radius:10px;padding:12px 10px;font-weight:700}
.cat.right{outline:3px solid var(--ok);outline-offset:2px}
.cat.wrong{outline:3px solid var(--bad);outline-offset:2px}
.seq{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;min-height:20px}
.seq .slot{font-family:var(--mono);font-size:14px;padding:8px 10px;border-radius:8px;background:color-mix(in srgb,var(--accent) 12%,var(--panel));display:flex;gap:8px}
.seq .slot.wrong{background:color-mix(in srgb,var(--bad) 14%,var(--panel))}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--panel2);border:1.5px solid var(--line);border-radius:999px;padding:8px 13px;font-size:15px}
.chip:disabled{opacity:.3}
.mtgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.mtcol{display:flex;flex-direction:column;gap:8px}
.mtb{text-align:left;background:var(--panel2);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px}
.mtb.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.mtb.paired{opacity:.55}
.mtb.right{border-color:var(--ok)} .mtb.wrong{border-color:var(--bad)}
.fb{margin-top:14px;border-radius:10px;padding:12px 14px;font-size:15px}
.fb.ok{background:color-mix(in srgb,var(--ok) 12%,var(--panel));border:1px solid var(--ok)}
.fb.no{background:color-mix(in srgb,var(--bad) 10%,var(--panel));border:1px solid var(--bad)}
.fb b{display:block;margin-bottom:2px}
.next{margin-top:14px;width:100%;background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:13px;font-weight:700;font-size:17px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.actions .next{flex:1 1 160px;margin-top:0}
.actions .ghostbtn{flex:1 1 160px;background:none;border:1.5px solid var(--line);border-radius:12px;padding:13px;font-weight:700}
.result h2{font-size:30px;margin:6px 0}
.big-stars{font-size:38px;letter-spacing:6px;color:var(--line)} .big-stars i{font-style:normal;color:var(--star)}
.stat{font-family:var(--mono);font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.misslist{margin:12px 0 0;padding-left:18px;font-size:14px;color:var(--muted)}
@media (max-width:440px){.stage{grid-template-columns:54px minmax(0,1fr) auto;gap:10px;padding:12px}.stars{font-size:13px;letter-spacing:1px}.cats{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
const DIA = {};
const STAGES = [];
let _sid = 0;
function STAGE(name, sub, mv, items){ const s = {name, sub, mv, items: items.flat()}; s.items.forEach((it,i)=>{ it.id = 's'+STAGES.length+'_'+i; it.stage = STAGES.length; }); STAGES.push(s); }
function mc(q,o,why,red){ return {t:'mc',q,o,why,hy:!!red}; }
function tq(q,o,why,red){ return {t:'mc',q,o,why,hy:!!red,trap:true}; }
function im(img,q,o,why,red){ return {t:'mc',img,q,o,why,hy:!!red}; }
function so(set,item,key,why,red){ return {t:'so',set,item,key,why,hy:!!red}; }
function od(q,steps,why,red){ return {t:'od',q,steps,why,hy:!!red}; }
function mt(q,pairs,why,red){ return {t:'mt',q,pairs,why,hy:!!red}; }
function lb(dia,name,why,red){ return {t:'lb',dia,name,why,hy:!!red}; }
function nm(dia,name,why,red,q,x){ x=x||{}; return {t:'nm',dia,name,why,hy:!!red,q:q||null,o:x.o||null,ans:x.ans||name,idx:x.idx||0}; }
function cs(text,steps,red,img){ return steps.map(s=>({t:'mc',ctx:text,img:img||null,q:s[0],o:s[1],why:s[2],hy:!!red,trap:true})); }
</script>
<script>
// ===== Lecture 13 content =====
const SORTS = {
  div: {label: 'Which division?', cats: [['aff','Afferent (sensory)','--c1'],['som','Somatic (efferent)','--c3'],['sym','Sympathetic','--c5'],['para','Parasympathetic','--c2']]},
  appr: {label: 'Which research approach?', cats: [['str','Structural','--c1'],['fun','Functional','--c3'],['beh','Behavioral','--c4'],['comp','Integrative / computational','--c2']]},
  plas: {label: 'Structural or functional plasticity?', cats: [['str','Structural','--c4'],['fun','Functional','--c3']]},
  mech: {label: 'Which plasticity mechanism?', cats: [['ltp','LTP','--c3'],['ltd','LTD','--c1'],['neuro','Neurogenesis','--c4'],['syn','Synaptogenesis','--c2'],['prune','Pruning','--c5']]},
  rew: {label: 'Which structure does this?', cats: [['pfc','Prefrontal cortex','--c1'],['vta','VTA','--c2'],['amy','Amygdala','--c3'],['hip','Hippocampus','--c4'],['nac','Nucleus accumbens','--c5']]},
  drug: {label: 'Which drug class?', cats: [['stim','Psychostimulants','--c5'],['opi','Opioids','--c2'],['alc','Alcohol','--c4'],['caf','Caffeine','--c1']]},
};

STAGE('Who Carries What', 'Organization: afferent, efferent, somatic, autonomic', 'Part 1', [
  tq('A patient\'s blood glucose drops and the CNS is informed, but the patient feels nothing. A student says "the autonomic NS detected it." What is the correct description?',['Visceral afferent input carried it IN; the autonomic NS only carries commands OUT','The autonomic NS detected it, because glucose is an internal signal','The somatic NS detected it','The efferent division detected it'],'Afferent = in. The ANS is part of the efferent (motor) division.',1),
  tq('Which of the following are TRUE? I. The efferent division is also called the motor division. II. The sympathetic NS is a branch of the somatic NS. III. Glands are autonomic targets. IV. Visceral input is not consciously perceived.',['I, III and IV','I and III','I, II and III','All of the above'],'II is false: sympathetic and parasympathetic are branches of the autonomic NS.',1),
  tq('A student recalls: 1. "The somatic NS controls skeletal muscle voluntarily." 2. "The parasympathetic NS prepares the body for fight or flight." Which best describes these statements?',['Statement 1 is accurate; statement 2 is not, because it describes the sympathetic NS','Both are accurate','Statement 2 is accurate; statement 1 is not','Neither is accurate'],'Parasympathetic = rest and digest.',1),
  tq('A drug blocks only the autonomic nervous system. Which function would still work normally?',['Voluntary contraction of skeletal muscle','Heart rate changes during stress','Gland secretion','Smooth muscle contraction in the intestine'],'Skeletal muscle is somatic. (Applied reasoning from the organization diagram.)',1),
  tq('True or False: Because cardiac muscle is muscle, the somatic nervous system controls heart rate.',['False','True'],'Somatic = skeletal muscle only. Cardiac muscle is an autonomic target.',1),
  tq('After a big meal you feel relaxed while your stomach and intestines become active. Which branch is dominant?',['Parasympathetic','Sympathetic','Somatic','Afferent'],'Rest and digest.',1),
  tq('Which pairing is correct?',['Efferent → CNS to effectors','Afferent → CNS to effectors','Autonomic → sensory input from organs','Somatic → smooth muscle'],'Efferent = out to muscles and glands.',1),
  tq('Touch on your arm reaches your cortex and you notice it. Your blood pressure information reaches your CNS and you don\'t. What is the key difference?',['Somatic sensory input reaches the cortex for conscious awareness; visceral input does not','Touch is efferent; blood pressure is afferent','Blood pressure travels in the autonomic NS','Touch travels in the somatic (motor) NS'],'Both are afferent; only somatic sensory input reaches awareness.',1),
  tq('Which statement is FALSE?',['Glands are effectors of the somatic nervous system','Effector organs are made of muscle and gland tissue','The CNS is the brain and spinal cord','The PNS connects the CNS to the rest of the body'],'Glands are autonomic targets.'),
  mc('What is the primary function of the nervous system?',['Rapid communication and control','Hormone secretion','Storing energy','Filtering the blood'],'Slide 2: communication and control via rapid signaling.'),
  mc('How does nervous signaling compare with endocrine signaling?',['Nervous works in milliseconds; endocrine takes minutes to days or longer','Endocrine is faster','Both work in milliseconds','Nervous takes hours'],'Nervous = electrical/neurotransmitters, milliseconds. Endocrine = hormones, minutes → weeks/years.'),
  mc('Which afferent input reaches conscious awareness?',['Somatic sensory input (touch, pain)','Visceral input from internal organs','Blood glucose level','All afferent input'],'Visceral input is not consciously perceived: "you never feel your blood glucose level."',1),
  mc('Where is information processed and where are decisions made?',['CNS','PNS','Afferent nerves','Effector organs'],'CNS = brain + spinal cord.'),
  so('div','Touch and pain reaching the cerebral cortex','aff','Somatic sensory input travels in the afferent division.'),
  so('div','Blood glucose information that you never feel','aff','Visceral input is afferent, but not consciously perceived.'),
  so('div','Voluntary contraction of skeletal muscle','som','Somatic = voluntary control of skeletal muscle.',1),
  so('div','Prepares the body for action or stress','sym','Sympathetic = fight or flight.'),
  so('div','Relaxation, digestion and reproduction','para','Parasympathetic = rest and digest.'),
  so('div','Motor neurons to skeletal muscle','som','That is the somatic pathway.'),
  od('Trace information through the nervous system.',['Stimulus','Afferent (sensory) division','CNS','Efferent (motor) division','Effector organ'],'Afferent → CNS → efferent.',1),
  mt('Match each autonomic target to the system that controls it.',[['Skeletal muscle','Somatic NS'],['Cardiac muscle','Autonomic NS'],['Smooth muscle of the intestine','Autonomic NS'],['Pituitary secretion (via hypothalamus)','Autonomic NS']],'Autonomic targets include smooth muscle, cardiac muscle and glands (exocrine and some endocrine).'),
  ...cs('Clicker 1: Which of the following best describes the autonomic nervous system?', [
    ['Which answer is correct?',['It carries motor signals to smooth and cardiac muscle','It carries sensory information from internal organs','It controls voluntary skeletal muscle contraction','It connects sensory receptors to the cerebral cortex'],'The ANS is motor (out of the CNS). Glands could be added, but "there\'s nothing wrong about it."'],
    ['Why is "carries sensory information from internal organs" the trap?',['"Internal organs" is the hook: it sounds autonomic, but sensory info travels IN (afferent), and the ANS is motor','The ANS has no connection to internal organs','Internal organs have no sensory neurons','Visceral input reaches conscious awareness'],'She called "internal organs" the hook of the trap.'],
    ['"Controls voluntary skeletal muscle contraction" describes which system?',['Somatic nervous system','Autonomic nervous system','Afferent division','Parasympathetic nervous system'],'Voluntary + skeletal muscle = somatic.'],
    ['Option C leaves out glands. Is it still correct?',['Yes. A statement does not need to be comprehensive, just have nothing wrong in it','No, any incomplete statement is false','Only if the question says "partially"','No, glands are the main ANS target'],'"There\'s nothing wrong about it."'],
  ], 1),
  tq('Which statement about the afferent division is TRUE?',['It carries both input you are aware of (touch, pain) and visceral input you never feel','All afferent input reaches the cerebral cortex and conscious awareness','It carries motor commands to internal organs','It is also called the motor division'],'Afferent = IN. Somatic sensory input reaches awareness; visceral input (e.g. blood glucose) does not.',1),
  tq('Your blood pressure drops and receptors in your vessels report it to the CNS. You feel nothing. Which division carried that report?',['Afferent division (visceral input)','Autonomic nervous system','Somatic nervous system','Efferent division'],'Trap: "internal organs/blood" sounds autonomic, but anything going INTO the CNS is afferent. The ANS is motor (out).',1),
  tq('Which statement is FALSE?',['The autonomic nervous system carries sensory information from the gut to the CNS','The autonomic nervous system controls glands','The somatic nervous system is under voluntary control','The parasympathetic system supports digestion'],'The ANS is part of the efferent (motor) division. Gut sensory info is visceral afferent input.',1),
  tq('An option reads: "The somatic nervous system carries touch information from the skin to the cortex." Why is it wrong?',['In her framework the somatic NS is an efferent (motor) branch; touch travels in the afferent division','Touch never reaches the cortex','The skin is controlled by the autonomic NS','It is correct'],'Hook word: "somatic." Somatic sensory input is afferent; the somatic nervous system on the diagram is motor.',1),
  tq('Your heart pounds before an exam. A classmate says "the heart is muscle, so the somatic NS did it." What is the correct answer?',['Sympathetic (autonomic) NS: cardiac muscle is an autonomic target','Somatic NS: all muscle is somatic','Parasympathetic NS: it calms the heart','Afferent division: the heart is sending signals'],'Somatic = skeletal muscle only. Cardiac and smooth muscle are autonomic; "fight or flight" = sympathetic.',1),
  tq('The hypothalamus controlling pituitary secretion is an example of:',['Autonomic (efferent) control of a gland','Somatic control of a gland','Afferent input from a gland','Hormone signaling with no nervous involvement'],'Her example: autonomic targets include some endocrine glands, e.g. pituitary secretion via the hypothalamus.'),
  tq('Statement: "The efferent division includes the somatic and autonomic nervous systems." It does not mention sympathetic or parasympathetic. Is it true?',['True. It has nothing wrong in it, and it does not need to be complete','False, because it leaves out sympathetic and parasympathetic','False, because the efferent division is sensory','True only for the spinal cord'],'Her rule: a statement doesn\'t need to be comprehensive to be correct; it needs "nothing wrong about it."',1),
  tq('Why does pulling your hand off a hot stove rely on the nervous system rather than hormones?',['Nervous signals act in milliseconds; hormones take minutes or longer','Hormones cannot reach the hand','The endocrine system only works during sleep','Nervous signals last longer than hormones'],'Primary function: rapid communication and control.'),
  tq('Which pairing is WRONG?',['Parasympathetic → "fight or flight"','Sympathetic → prepares the body for stress','Somatic → voluntary skeletal muscle','Autonomic → smooth muscle, cardiac muscle, glands'],'Parasympathetic is "rest and digest."'),
  tq('According to her, what is the best way to beat a trap option?',['Know the answer from the diagram/story before reading the options, then reject options that contradict it','Pick the longest option','Pick the option with the most familiar words','Eliminate options that are incomplete'],'"Before you get to the options, you already should know the answer."',1),
  tq('Which of the following are TRUE? I. Visceral input is part of the afferent division. II. The autonomic NS controls skeletal muscle. III. The sympathetic NS prepares the body for stress. IV. Somatic sensory input reaches conscious awareness.',['I, III and IV','I and III','II and III','I, II, III and IV'],'II is false: skeletal muscle is somatic.',1),
  tq('A student recalls: 1. "The efferent division carries signals from the CNS to effectors." 2. "The autonomic NS carries sensory signals from internal organs." Which best describes these statements?',['Statement 1 is accurate; statement 2 is not, because it describes visceral afferent input','Both are accurate','Statement 2 is accurate; statement 1 is not','Neither is accurate'],'The ANS is motor. "Internal organs" is the hook.',1),
  tq('A patient has a spinal injury that cuts the efferent pathway to the legs but leaves the afferent pathway intact. What would you expect?',['They can feel touch on the legs but cannot voluntarily move them','They can move the legs but feel nothing','They lose both feeling and movement','Their digestion stops'],'Afferent = sensing (in); efferent somatic = voluntary movement (out). (Applied reasoning from the organization diagram.)'),
]);

STAGE('Complexity & Tools', 'Neurons, glia, connections, and picking the right scan', 'Part 1', [
  mc('About how many neurons are in the human nervous system?',['~87 billion','~87 million','~8.7 billion','~870 billion'],'Slide 4: ~87 billion neurons.',1),
  mc('About how many glial cells are there?',['~90 billion, as many as neurons','~9 billion','About 1 for every 100 neurons','None in the CNS'],'~90 billion glia. "Without glia cells... [the] nervous system will fall apart."'),
  mc('Which is NOT a glial job listed in the lecture?',['Firing action potentials to carry the main signal','Myelinating axons','Supplying metabolic fuel','Immune defense'],'Glia myelinate, regulate the environment, supply fuel and defend; neurons carry the signals.'),

STAGE('Fire Together', "Hebb's rule and the many kinds of LTP", 'Part 2', [

  mc('When you learn a phone number in minutes, what changes?',['The connections (synapses) between neurons','The number of neurons','The type of neurotransmitter used','The size of the skull'],'You can\'t grow new neurons in minutes, so the connections must change.',1),
  mc('Hebb\'s rule says that if neuron A repeatedly helps fire neuron B:',['The A→B synapse gets stronger','Neuron A dies','The A→B synapse is pruned','Neuron B stops responding'],'"Repeatedly is the keyword."',1),
  mc('"Neurons that fire together, wire together" means:',['Connections that are already wired get stronger when the neurons are active together','Brand-new neurons grow between them','The neurons merge into one cell','The neurons stop firing'],'They were already wired; the wiring gets stronger.'),
  mc('Hebb\'s principle is the conceptual description of:',['Long-term potentiation (LTP)','Pruning','Neurogenesis','The resting membrane potential'],'Slide 13.',1),
  mc('When was LTP actually discovered experimentally?',['The 1970s, validating Hebb\'s prediction','1949','The 1850s','2010'],'Hebb predicted it (1949 on the slide); LTP was found in the 1970s.'),
  mc('Where is learning stored, according to the Hebb slide?',['In patterns of strengthened connections across networks','In single neurons','In glial cells only','In the blood'],'"It\'s all about who connects with who and how strong they\'re connected."',1),
  mc('LTP is considered:',['The cellular basis of learning and memory','The cause of phantom limb','A form of pruning','A type of glial cell'],'Slide 13 last bullet.',1),
  mc('What is the point of the "Multiple Ways of LTP" table?',['LTP is multiple processes, not one; different synapses follow different rules','You must memorize every row','LTP only happens presynaptically','Only NMDA-dependent LTP exists'],'"The table here is not intended for you to memorize everything."',1),
  mc('Which LTP type is the "classic" one she covered in depth?',['NMDA-dependent LTP','Mossy fiber LTP','mGluR-dependent LTP','STDP'],'Classic: NMDA → Ca²⁺ → CaMKII → AMPA insertion, postsynaptic.'),
  mc('Mossy fiber LTP is expressed:',['Presynaptically (cAMP/PKA → more transmitter release)','Postsynaptically via NMDA','Only in muscle','By pruning'],'From the table, which she said is not for memorizing. (Lower priority.)'),
  mc('Why does she say strengthening is never "automatic or simple"?',['Even muscle hypertrophy needs a whole pathway with gene expression changes','Synapses strengthen by chance','Strengthening needs no proteins','It only takes one ion'],'Strengthening takes a full molecular pathway.'),
  tq('Neuron A fires once and neuron B happens to fire. Does Hebb\'s rule predict a stronger A→B synapse?',['No. A must REPEATEDLY or persistently take part in firing B','Yes, any single co-firing strengthens it','Yes, but only if B fires first','No, Hebb\'s rule is about weakening'],'"Repeatedly is the keyword."',1),
  tq('"Neurons that fire together, wire together" means:',['Existing connections between co-active neurons get stronger','New neurons are born between them','The neurons physically fuse','The neurons stop firing to save energy'],'Trap: "wire" doesn\'t mean brand-new wires; "they were already wired."',1),
  tq('An option says learning a phone number in minutes happens by adding new neurons. Why is it wrong?',['You can\'t grow neurons in minutes; the connections between existing neurons change','Neurogenesis only happens in children','Phone numbers are stored in glia','It is correct'],'Hebb\'s logic: neurons don\'t change that fast, synapses do.',1),
  tq('What is the relationship between Hebb\'s principle and LTP?',['Hebb\'s principle is the concept; LTP is the experimentally found mechanism','LTP came first and Hebb explained it','They are unrelated','Hebb\'s principle describes LTD'],'Hebb predicted it (1949); LTP was found in the 1970s.',1),
  tq('Which statement is FALSE?',['LTP is a single process that works the same at every synapse','Different synapses follow different LTP rules','NMDA-dependent LTP is expressed postsynaptically','LTP is considered the cellular basis of learning and memory'],'Takeaway of the table: LTP is multiple processes, not one.',1),
  tq('Where is a memory stored, in Hebb\'s view?',['In patterns of strengthened connections across a network','In one specific neuron','In the cell body\'s DNA only','In the cerebellum only'],'"It\'s all about who connects with who and how strong they\'re connected."',1),
  tq('Why can\'t synapses simply get stronger "automatically"?',['Strengthening needs a whole molecular pathway, including gene expression changes','They can; it requires nothing','Only glia can strengthen synapses','Strengthening only needs one Na⁺ ion'],'Her muscle hypertrophy comparison.'),

  tq('A student recalls: 1. "Ca²⁺ entering through NMDA activates CaMKII." 2. "CaMKII directly activates gene expression in step 9." Which best describes these statements?',['Statement 1 is accurate; statement 2 is not, because CREB drives gene expression','Both are accurate','Statement 2 is accurate; statement 1 is not','Neither is accurate'],'Step 5 vs steps 8–9.',1),
  tq('True or False: Phosphorylation of AMPA receptors by CaMKII makes each receptor pass more Na⁺.',['True','False'],'Step 6: increased conductance, the channel "opens wider."',1),
  tq('True or False: A single brief burst of Ca²⁺ is enough to activate CREB and produce long-term structural change.',['False','True'],'CREB needs sustained, strong Ca²⁺ signaling.',1),

  tq('Why is the AMPA–NMDA arrangement described as a positive feedback loop?',['More and better AMPA receptors → stronger depolarization → more Ca²⁺ through NMDA → more CaMKII → even more AMPA','NMDA inhibits AMPA, which stops LTP','Ca²⁺ blocks AMPA after it enters','CREB removes AMPA receptors'],'Steps 6 and 7 feed back to step 2.',1),
  tq('Which event links the temporary electrical signal to a long-term structural change?',['Sustained Ca²⁺ activating CREB, leading to new gene expression and proteins','Na⁺ entering through AMPA','Mg²⁺ binding NMDA at rest','Glutamate diffusing out of the cleft'],'Electrical → Ca²⁺ → CREB → genes → structure.',1),
  tq('An option says: "Insertion of additional AMPA receptors removes the Mg²⁺ block from NMDA." Why is it wrong?',['AMPA insertion happens later (step 7), after NMDA is already open; depolarization in step 2 removes the block','AMPA receptors are never inserted','Insertion happens before glutamate release','It is correct'],'Clicker 4 logic: timing gives it away.',1),
  tq('Which describes the role of Na⁺ and Ca²⁺ in LTP correctly?',['Na⁺ (via AMPA) depolarizes; Ca²⁺ (via NMDA) is the second messenger that triggers strengthening','Na⁺ is the second messenger; Ca²⁺ depolarizes','Both act only as second messengers','Ca²⁺ enters through AMPA'],'AMPA = Na⁺; NMDA = Ca²⁺.',1),
  tq('Low-frequency stimulation releases little glutamate. Which outcome fits the LTP story best?',['Weak AMPA depolarization may not remove the Mg²⁺ block, so NMDA-dependent LTP is unlikely','LTP is stronger with low frequency','CREB is activated more','New synapses form faster'],'LTP needs high-frequency stimulation; low frequency is linked to LTD. (Partly applied reasoning.)',1),
  od('Put NMDA-dependent LTP steps 1–5 in order.',['High-frequency stimulation → glutamate release','Glutamate activates AMPA → Na⁺ influx → depolarization','Depolarization removes Mg²⁺ block from NMDA','Glutamate activates NMDA → Ca²⁺ influx','Ca²⁺ activates CaMKII'],'"Any single one of them can be tested."',1),
  od('Put NMDA-dependent LTP steps 5–10 in order.',['Ca²⁺ activates CaMKII','CaMKII phosphorylates AMPA → ↑ conductance','CaMKII inserts additional AMPA receptors','Sustained Ca²⁺ activates CREB','CREB → new gene expression + protein synthesis','New proteins support structural changes'],'Steps 5–10.',1),
  mt('Match each receptor to its ion.',[['AMPA receptor','Na⁺ influx'],['NMDA receptor','Ca²⁺ influx'],['Mg²⁺','Blocks NMDA at rest']],'AMPA = Na⁺ channel; NMDA = Ca²⁺ channel.',1),
  mc('NMDA-dependent LTP happens at which kind of synapse?',['Glutamate (excitatory) synapses','GABA (inhibitory) synapses','Neuromuscular junctions','Gap junctions'],'Slide 15 applies to glutamate synapses.'),
  mc('What is the job of the AMPA-driven depolarization in step 2?',['To relieve the Mg²⁺ block on the neighboring NMDA receptor','To fire an action potential every time','To release Ca²⁺ from the ER','To phosphorylate CREB'],'Depolarization "doesn\'t necessarily fire an AP"; its job is to affect the NMDA receptor next door.',1),
  mc('At resting potential, NMDA receptors are:',['Blocked by Mg²⁺','Wide open','Phosphorylated','Missing from the membrane'],'Step 3 removes this block.'),
  mc('What does Ca²⁺ act as in step 5?',['A powerful second messenger','A neurotransmitter','A transcription factor','A receptor'],'Ca²⁺ triggers multiple changes inside the cell.'),
  mc('In step 6, CaMKII phosphorylates AMPA receptors, which:',['Increases their conductance (the channel "opens wider")','Closes them','Removes them from the membrane','Turns them into Ca²⁺ channels'],'More Na⁺ in, more depolarization.',1),
  mc('Steps 6 and 7 feed back to step 2. This creates:',['A positive feedback loop: stronger depolarization → more Ca²⁺ → more CaMKII → stronger synapse','A negative feedback loop that ends LTP','LTD','Pruning'],'The positive feedback loop on the slide.',1),

  mc('Which is NOT one of the step 10 structural changes?',['Fewer synapses','More neurotransmitter release from the presynaptic neuron','More synapses','Bigger postsynaptic response'],'Step 10: presynaptic release ↑, synapses ↑, postsynaptic response ↑.'),
  mc('The big picture of NMDA LTP is:',['A temporary electrical signal is converted into a long-term structural change','A structural change becomes a temporary signal','Neurons are replaced by new ones','Glia take over transmission'],'"This is how experience or usage is stored in the brain."',1),
  tq('True or False: In NMDA-dependent LTP, the NMDA receptor is the first receptor to respond to glutamate and depolarize the cell.',['False','True'],'AMPA depolarizes first (step 2); NMDA is still Mg²⁺-blocked until then.',1),
  ...cs('Clicker 4: What causes the Mg²⁺ block to be removed from NMDA receptors?', [
    ['Which answer is correct?',['Depolarization due to AMPA receptor-mediated Na⁺ influx','Binding of glutamate to NMDA receptors','Phosphorylation of NMDA receptors','Insertion of additional AMPA receptors'],'Step 2 → step 3. "Before you get to the options, you already should know the answer."'],
    ['Why is "glutamate binding to NMDA" wrong?',['Binding opens the channel, but nothing passes while Mg²⁺ is still blocking','Glutamate never binds NMDA','Glutamate is inhibitory','Binding removes the receptor'],'Binding ≠ unblocking.'],
    ['Why is "phosphorylation of NMDA" wrong?',['It is not in the story: AMPA gets phosphorylated, not NMDA','NMDA is always phosphorylated','Phosphorylation adds Mg²⁺','It happens before step 1'],'Step 6 phosphorylates AMPA.'],
    ['Why is "insertion of additional AMPA receptors" wrong?',['It happens after NMDA is already open (step 7), so it can\'t be the cause','It never happens','It happens in the presynaptic neuron','It removes glutamate'],'Step 7 is downstream.'],
  ], 1),
  tq('Which ion enters through AMPA receptors?',['Na⁺','Ca²⁺','Mg²⁺','Cl⁻'],'AMPA = Na⁺ channel. Trap: Ca²⁺ is the NMDA ion.',1),
  tq('Which ion enters through NMDA receptors once unblocked?',['Ca²⁺','Na⁺ only','Mg²⁺','K⁺'],'NMDA = Ca²⁺ channel.',1),
  tq('Statement: "Glutamate binding is enough to let Ca²⁺ into the cell through NMDA receptors." True?',['False. Mg²⁺ still blocks the channel until depolarization removes it','True','True, but only at high frequency','False, because glutamate never binds NMDA'],'NMDA needs BOTH glutamate binding and depolarization (to remove Mg²⁺).',1),
  tq('Why does LTP need HIGH-frequency stimulation?',['Lots of glutamate → strong AMPA depolarization → enough to remove the Mg²⁺ block','High frequency directly opens NMDA receptors','High frequency removes CaMKII','Low frequency releases no glutamate at all'],'(Linking step 1 to step 3 is the story she told; the "low frequency isn\'t enough" part is inference.)',1),
  tq('What does CaMKII phosphorylate?',['AMPA receptors','NMDA receptors','Mg²⁺','CREB directly in step 6'],'Trap: NMDA is never phosphorylated in the story. Step 6 = AMPA.',1),
  tq('Which step requires SUSTAINED Ca²⁺ signaling?',['Activation of CREB (step 8)','AMPA activation (step 2)','Glutamate release (step 1)','Removal of the Mg²⁺ block (step 3)'],'Only strong, long-lasting Ca²⁺ reaches CREB.',1),
  tq('A drug blocks NMDA receptors. Glutamate is released normally. What happens?',['AMPA still depolarizes the cell, but no Ca²⁺ enters, so CaMKII isn\'t activated and LTP fails','LTP happens normally','No glutamate can bind AMPA','Mg²⁺ floods the cell'],'(Applied reasoning from the 10 steps.)',1),
  tq('A drug blocks CREB. Which part of LTP is lost?',['The long-term structural changes (gene expression, new proteins, new synapses)','AMPA depolarization','Ca²⁺ entry through NMDA','CaMKII activation'],'Steps 1–7 can still happen; steps 9–10 need CREB. (Applied reasoning.)',1),
  tq('Does the AMPA depolarization in step 2 have to fire an action potential?',['No. Its job is to remove the Mg²⁺ block on the NMDA receptor next door','Yes, LTP requires an AP every time','Yes, otherwise glutamate is not released','No, because AMPA receptors don\'t depolarize the cell'],'"It doesn\'t necessarily fire an AP."',1),
  tq('Steps 6 and 7 feed back to which step?',['Step 2 (AMPA depolarization)','Step 1 (glutamate release)','Step 8 (CREB)','Step 10 (structural change)'],'More/better AMPA → stronger depolarization → more Ca²⁺ → more CaMKII.',1),
  tq('In LTP, Ca²⁺ mainly acts as:',['A second messenger','A neurotransmitter released into the cleft','A channel blocker','A transcription factor'],'Trap: CREB is the transcription factor; Ca²⁺ is the second messenger that activates it.',1),
  tq('Which statement about step 10 is FALSE?',['Only the postsynaptic neuron changes','The presynaptic neuron releases more glutamate','New synapses form','The postsynaptic response gets bigger'],'Step 10 changes both sides.',1),
  tq('Put these in the right relationship: CREB and CaMKII.',['CaMKII acts first (step 5); CREB comes later with sustained Ca²⁺ (step 8)','CREB activates CaMKII','They act at the same moment','CREB is a receptor and CaMKII an ion'],'Step 5 before step 8.'),
  tq('Which of the following are TRUE? I. AMPA receptors pass Na⁺. II. Glutamate binding alone opens the NMDA pore to Ca²⁺. III. CaMKII phosphorylates AMPA receptors. IV. CREB activation needs sustained Ca²⁺.',['I, III and IV','I, II and III','I and III','All of the above'],'II is the trap: Mg²⁺ must first be removed by depolarization.',1),
  tq('A student recalls: 1. "CaMKII inserts new AMPA receptors." 2. "CREB removes the Mg²⁺ block." Which best describes these statements?',['Statement 1 is accurate; statement 2 is not, because depolarization removes the Mg²⁺ block','Both are accurate','Statement 2 is accurate; statement 1 is not','Neither is accurate'],'Step 7 vs step 3.',1),
  tq('A mutant mouse lacks CaMKII. Glutamate release, AMPA and NMDA receptors are normal. What happens to LTP?',['Ca²⁺ still enters, but AMPA isn\'t phosphorylated or added, so the synapse doesn\'t strengthen','LTP is stronger than normal','Glutamate is no longer released','The Mg²⁺ block can\'t be removed'],'Ca²⁺ → CaMKII is the link between Ca²⁺ influx and strengthening. (Applied reasoning.)',1),
]);

STAGE('Reward Circuit', 'Who evaluates, who integrates, who acts', 'Part 3', [
  mc('Once the NAc has biased them, what do the basal ganglia do?',['Select & initiate actions','Release dopamine','Store memories','Evaluate goals'],'Basal ganglia sit outside the reward system and select and initiate actions.'),
  so('rew','Represents goals, rules and priorities; if positive → VTA','pfc','Top-down evaluation.',1),
  so('rew','Responds strongly to cues that predict reward and releases dopamine','vta','VTA → dopamine → NAc.',1),
  so('rew','Tags an option with emotional meaning','amy','Emotional salience.',1),
  so('rew','Provides where, when and memory','hip','Context and memory.',1),
  so('rew','Integrates emotion, context and reward value to bias the basal ganglia','nac','The hub.',1),
  so('rew','Receives hypothalamus and brainstem homeostatic data','vta','The VTA integrates PFC, amygdala, hippocampus, hypothalamus and brainstem.'),
  mc('What is the function of the reward system?',['Evaluate the values of options and generate motivation for certain actions','Select and initiate movements','Store long-term memories','Control heart rate'],'Slide 19.',1),
  mc('Are the basal ganglia part of the reward system?',['No. They select and initiate actions; the reward system biases them','Yes, they are its center','Yes, they release dopamine','Only during sleep'],'She stressed this.',1),
  mc('She called the NAc:',['"An influencer rather than a decision maker"','The decision maker','A motor command center','A sensory relay'],'The NAc doesn\'t generate motor commands; it sets how strongly actions are favored.',1),
  mc('What does dopamine do in the NAc?',['Amplifies or dampens how strongly the NAc responds to all its other inputs','Directly moves the muscles','Blocks the PFC','Stores memories'],'Dopamine largely sets the strength of NAc output.',1),
  mc('Why is it called the "reward" system?',['Dopamine alone represents the reward value of each option and has the most say in NAc output','Because it only works when you get a prize','Because it releases endorphins','Because it is in the cortex'],'Slide 19 discussion.'),
  mc('What is rewarding is:',['Partly prewired and partly learned','Entirely innate','Entirely learned','Random'],'Newborn knows milk is good (prewired); valuing brushing teeth after a dentist visit (learned).'),
  mc('The reward system\'s plasticity is:',['Dopamine-dependent, enabling learning from outcomes','NMDA-dependent only','Absent','Only in the spinal cord'],'Contrast with the NMDA-dependent plasticity of Part 2.'),
  mc('"The reward system doesn\'t choose the action, it..."',['"...biases the competition"','"...blocks all actions"','"...moves the muscles"','"...erases memories"'],'Her phrasing from the cookie case.',1),
  od('Cookie case (normal): put the steps in order.',['Cookie cue detected','PFC evaluates against goals','Amygdala tags it emotionally positive','Hippocampus provides context','VTA releases dopamine','NAc integrates; dopamine amplifies cookie inputs','NAc biases basal ganglia (wanting)','Action selected: eat the cookie'],'Slide 20, steps 2–9.',1),
  mc('In the normal cookie case, what happens after you eat the cookie?',['Dopamine-dependent plasticity strengthens the cookie circuit, so the choice is faster next time','The circuit is pruned','Nothing changes','The PFC is permanently disabled'],'Step 10.'),
  tq('True or False: When you choose to keep studying instead of eating the cookie, the nucleus accumbens is the structure that selected "keep studying."',['False','True'],'The NAc only biases the competition; the basal ganglia select and initiate the action.',1),
  tq('True or False: A strong dopamine surge in the NAc makes the cookie taste better, which is why you eat it.',['False','True'],'Dopamine signals reward value and biases action (wanting); it is not about taste.',1),
  ...cs('After education: you learned "sugar is bad for me." You see a cookie while studying.', [
    ['What does the PFC do now?',['Evaluates the cookie against goals AND learned rules ("sugar is bad for me")','Shuts off completely','Releases dopamine directly','Moves your hand'],'Step 3 on slide 21.'],
    ['What does the VTA do?',['Releases less dopamine because predicted reward is lower','Releases more dopamine','Stops existing','Sends signals to the muscles'],'Step 6.'],
    ['What happens to the basal ganglia?',['They are less biased toward the cookie; studying stays competitive','They are removed','They choose the cookie faster','They release dopamine'],'Step 8.'],
    ['With repeated rejection, what happens to the cookie circuit?',['Plasticity weakens it, so the urge comes less often and less intensely','It grows stronger','It turns into an NMDA synapse','It moves to the cerebellum'],'Step 10: previously strong synapses weaken.'],
    ['Does education remove the reward system?',['No. It changes the input signals, which changes the output and behavior','Yes, it deletes it','Yes, but only the VTA','No, education has no effect at all'],'Her first takeaway from slide 21.'],
  ], 1),
  tq('An option says: "The nucleus accumbens decides which action you take." Why is it wrong?',['The NAc only biases; the basal ganglia select and initiate actions','The PFC decides everything','The VTA decides','It is correct'],'NAc = "an influencer rather than a decision maker."',1),
  tq('Which statement is FALSE?',['The basal ganglia are part of the reward system','The VTA releases dopamine into the NAc','The amygdala sends emotional salience to the NAc','The hippocampus sends context and memory to the NAc'],'Basal ganglia are outside the reward system.',1),
  tq('Which describes dopamine flow correctly?',['VTA → NAc','NAc → VTA','PFC → NAc as dopamine','Basal ganglia → VTA'],'Trap: direction reversed. The VTA releases dopamine into the NAc.',1),
  tq('An option says the amygdala provides "where and when" information. Which structure actually does that?',['Hippocampus','Amygdala','VTA','Basal ganglia'],'Amygdala = emotional salience. Hippocampus = context and memory.',1),
  tq('Does the PFC release dopamine?',['No. It evaluates options against goals and rules and signals the VTA, which releases dopamine','Yes, it is the main dopamine source','Yes, directly into the basal ganglia','No, it has no connection to the reward system'],'Top-down evaluation → VTA.',1),
  tq('Dopamine in the NAc:',['Amplifies or dampens how strongly the NAc responds to all its other inputs','Directly generates motor commands','Replaces the inputs from the PFC','Only signals pain'],'NAc doesn\'t generate motor commands.',1),
  tq('After learning "sugar is bad," you skip the cookie. What changed?',['The input signals (PFC rules, weaker amygdala salience, hippocampal memory) → less dopamine → less bias','The reward system was removed','The basal ganglia were damaged','Dopamine receptors disappeared'],'Education changes inputs, not the existence of the system.',1),
  tq('You skip the cookie many times in a row. What happens over time?',['Dopamine-dependent plasticity weakens the cookie circuit, so the urge fades','The cookie circuit gets stronger','Nothing; circuits never change','The NAc is pruned'],'Repeated rejection weakens previously strong synapses.',1),
  tq('You are very hungry while studying. How would that most likely affect the cookie decision?',['Hypothalamus/brainstem input to the VTA raises predicted reward → more dopamine → stronger bias toward the cookie','Hunger only affects the PFC','Hunger blocks the VTA','No effect; homeostatic data don\'t reach the reward system'],'The VTA integrates homeostatic data from the hypothalamus and brainstem. (Applied reasoning.)'),
  tq('Which is the best summary of the reward system\'s job?',['Evaluate the value of options and bias the competition between actions','Select and execute movements','Store memories of rewards','Release dopamine everywhere equally'],'"It doesn\'t choose the action, it biases the competition."',1),
  tq('A depressed patient shows no motivation for pleasant cues, while a person with addiction shows strong wanting for drug cues. Which best explains the contrast?',['Weak dopamine signaling to the NAc vs drug cues strengthened by dopamine-driven LTP','Both have too much dopamine','Depression strengthens the basal ganglia','Both lack an amygdala'],'Dopamine sets how strongly the NAc favors an option; drug-induced LTP makes cues powerful triggers. (Depression is not in the lecture; this is modeled on her exam style.)',1),
  tq('A student recalls: 1. "The NAc selects and initiates actions." 2. "The VTA releases dopamine into the NAc." Which best describes these statements?',['Statement 2 is accurate; statement 1 is not, because it describes the basal ganglia','Both are accurate','Statement 1 is accurate; statement 2 is not','Neither is accurate'],'NAc is an influencer; the basal ganglia select and initiate.',1),
  tq('Which of the following are TRUE? I. The PFC evaluates options against goals and rules. II. The basal ganglia are the hub of the reward system. III. The amygdala tags emotional salience. IV. What is rewarding is partly learned.',['I, III and IV','I and III','I, II and III','All of the above'],'II is false: the NAc is the hub; basal ganglia are outside the system.',1),
]);

STAGE('Hijacked', 'Drugs, gambling, LTP and why addiction sticks', 'Part 3', [
  od('Put the stages of addiction in order.',['Initial use','Regular use','Tolerance','Dependence','Addiction'],'Slide 23 arrow.',1),
  so('drug','Cocaine blocks dopamine reuptake','stim','Psychostimulant: massive dopamine buildup.',1),
  so('drug','Amphetamine increases dopamine release','stim','Psychostimulant.'),
  so('drug','Activates μ-opioid receptors, inhibiting GABA neurons that suppress dopamine cells','opi','Opioids = disinhibition of dopamine neurons.',1),
  so('drug','Fentanyl and heroin','opi','Opioids.'),
  so('drug','Indirectly enhances dopamine via GABA/glutamate balance','alc','Alcohol.'),
  so('drug','Blocks adenosine receptors, reducing inhibition of dopamine signaling','caf','Caffeine: mild increase in dopamine and alertness.',1),
  mc('Natural rewards raise dopamine:',['Only within tightly regulated ranges','Without limit','Not at all','More than drugs do'],'The brain regulates release, lifetime and receptor response.'),
  mc('Drugs overpower the reward system by:',['Blocking dopamine breakdown or reuptake, or removing inhibitory circuits, so dopamine accumulates','Binding dopamine receptors directly instead of dopamine','Tasting good','Acting only on the PFC'],'Response is far larger and longer lasting than natural rewards.',1),
  mc('Gambling and gaming raise dopamine most strongly:',['During anticipation, because rewards are unpredictable','Only after the reward is received','Never','Only when you lose'],'Natural rewards raise dopamine when received; gambling during anticipation.',1),
  mc('Why do variable reward schedules give bigger dopamine spikes?',['Dopamine fires most when rewards are unexpected or better than expected (prediction error)','Because rewards are always large','Because the reward is predictable','Because they block reuptake'],'Slot machines and loot boxes exploit prediction error.',1),
  mt('Match each reward type to its dopamine pattern.',[['Natural rewards','Moderate, regulated, linked to survival'],['Drugs','Massive, chemically forced, artificial'],['Gambling & gaming','Repeated unpredictable spikes, exploits prediction error']],'Slide 22 comparison table.',1),
  mc('Without LTP, what would happen after drug use?',['The high would fade and the brain would move on','Addiction would be guaranteed','Dopamine would stay high forever','Tolerance would disappear'],'Drugs don\'t cause addiction without the brain\'s cooperation: plasticity, especially LTP.',1),
  mc('High dopamine during drug use induces LTP that strengthens:',['ALL synapses active at that moment: cues, actions and the reward pathway','Only the drug pathway','Only the PFC','No synapses'],'That\'s why cues become powerful triggers.',1),
  mc('Which is an immediate consequence of drug-induced LTP?',['Drug-associated cues become powerful triggers','Competing behaviors get stronger','Drug-seeking becomes harder to start','Dopamine receptors increase'],'Also: drug-seeking easier to initiate, competing behaviors weaken.'),
  mc('Why does relapse happen after long abstinence?',['"The drug may be gone, but the strengthened pathway remains"','The drug stays in the blood for years','The PFC regrows too strongly','Dopamine receptors vanish permanently'],'Long-lasting physical changes: more AMPA receptors, dendrite remodeling, altered gene expression.',1),
  mc('Which is a long-lasting physical change from LTP in addiction?',['Increased AMPA receptor insertion','Removal of all NMDA receptors','Loss of the VTA','Growth of new neurons in the PFC'],'Recall the NMDA LTP steps.'),
  mc('She described addiction as:',['"Not a problem of willpower. It\'s a problem of synaptic changes that become too strong and too stable"','A simple choice','Purely genetic','A problem of the spinal cord'],'Slide 23 result.',1),
  mt('Match each "Hooked" reason to its explanation.',[['Hijacked reward system','Drug becomes the highest-value option'],['Tolerance and dependence','Less dopamine or fewer receptors, so more drug is needed'],['Enhanced memory and cues','A lighter or a friend triggers craving'],['Reduced self-control','Weaker PFC activity']],'Slide 24.',1),
  mc('Tolerance and dependence (Hooked point 2):',['Was not covered in detail; know the basic idea of fewer receptors/less dopamine and withdrawal','Must be memorized in molecular detail','Was skipped entirely','Is the same as pruning'],'"This we did not touch in detail."'),
  mc('Seeing a lighter triggers intense craving. Which mechanism?',['Enhanced memory and cues via LTP ("fire together, wire together")','Pruning','Neurogenesis','Reduced dopamine reuptake'],'Hooked point 3.'),
  mc('"The only thing fighting against the dopamine high would be your..."',['Prefrontal cortex','Amygdala','Hippocampus','Cerebellum'],'And addiction weakens it.'),
  tq('True or False: Without LTP, a drug could still produce a high, but addiction would be much less likely to develop.',['True','False'],'"Without LTP, the high would fade and the brain would move on."',1),
  ...cs('Clicker 5: Why are drugs so effective at hijacking the brain\'s reward system?', [
    ['Which answer is correct?',['They produce a much stronger and more immediate dopamine surge than natural rewards','They bind and activate dopamine receptors to create pleasure','They taste good and trigger a stronger dopamine surge than candies','They act only on the PFC, bypassing emotional centers that exercise self-control'],'That is why drugs control the reward system better than any natural reward.'],
    ['Why is "they bind and activate dopamine receptors" wrong, per her?',['Dopamine receptors bind dopamine; the drug makes the VTA release lots of dopamine','Drugs never reach the brain','Dopamine receptors don\'t exist','They bind adenosine only'],'Per her reasoning: wanting comes from dopamine release, pleasure from satisfying the want.'],
    ['Why is "they act only on the PFC, bypassing emotional centers that exercise self-control" wrong?',['Emotional centers don\'t exercise self-control; the PFC does, and drugs weaken it','Drugs make the PFC stronger','The amygdala controls impulses','Drugs don\'t affect the PFC'],'"Almost absurd." The amygdala and hippocampus actually help the drug work with cues and context.'],
    ['Why is "they taste good" wrong?',['Drugs work by disrupting regulatory mechanisms, not through taste','Drugs taste bad','Candy has no dopamine effect','Taste is processed by the VTA'],'Longer dopamine survival, removed inhibition.'],
  ], 1),
  tq('An option says opioids raise dopamine by binding dopamine receptors. What is the correct mechanism?',['They activate μ-opioid receptors, inhibiting GABA neurons that normally suppress dopamine cells (disinhibition)','They block dopamine reuptake','They block adenosine receptors','They break down dopamine faster'],'Disinhibition of dopamine neurons.',1),
  tq('Cocaine and amphetamine both raise dopamine. Which is correct?',['Cocaine blocks reuptake; amphetamine increases release','Both block reuptake','Cocaine increases release; amphetamine blocks reuptake','Both act on adenosine receptors'],'Easy to swap. Slide 22 table.',1),
  tq('Caffeine raises alertness by:',['Blocking adenosine receptors, which reduces inhibition of dopamine signaling','Directly activating dopamine receptors','Blocking dopamine reuptake','Activating μ-opioid receptors'],'Trap: caffeine is not a dopamine agonist.',1),
  tq('Gambling produces the biggest dopamine spikes when:',['Rewards are unpredictable or better than expected','You win a predictable, fixed prize','You lose every time','Rewards come at regular intervals'],'Prediction error. Variable rewards: you don\'t know when or how big.',1),
  tq('Drug-induced LTP strengthens:',['All synapses active at that moment, including cues, people and places','Only the drug-reward synapses','Only the PFC','No synapses; drugs block LTP'],'That is why a lighter or a friend becomes a trigger.',1),
  tq('Someone relapses after 5 years drug-free. Best explanation?',['The drug is gone, but the strengthened pathways (more AMPA receptors, remodeled dendrites) remain','The drug was stored in the brain for 5 years','Willpower always weakens with age','Dopamine receptors have grown back too much'],'"The drug may be gone, but the strengthened pathway remains."',1),
  tq('An option says addiction is mainly a failure of willpower. How would she answer?',['Wrong: "It\'s a problem of synaptic changes that become too strong and too stable"','Right: it is a choice','Right, because the PFC is stronger in addiction','Wrong: it is purely genetic'],'Slide 23.',1),
  tq('The addicted brain has fewer dopamine receptors. What does that cause?',['Tolerance: more drug is needed to feel the same, or just to feel normal','More pleasure from natural rewards','Stronger self-control','Faster recovery'],'Hooked point 2 (not covered in detail).',1),
  tq('An option says the amygdala and hippocampus protect against addiction by exercising self-control. Why is it wrong?',['They help the drug work by supplying cues and context; the PFC exercises self-control, and drugs weaken it','They are not connected to the NAc','They release dopamine','It is correct'],'Her reasoning on Clicker 5, option D.',1),
  tq('A person knows the risks and wants to stop but can\'t resist. Which Hooked reason fits best?',['Reduced self-control: the PFC is weakened while the motivation system is strengthened','Emotional escape','Tolerance only','Gambling'],'"Motivation system stronger, regulating system weaker."',1),
  tq('Why can\'t a natural reward like food "compete" with a drug?',['The brain tightly regulates natural dopamine; drugs bypass that regulation for a bigger, longer surge','Food doesn\'t release dopamine at all','Food only acts on the PFC','Drugs taste better'],'Natural rewards stay within regulated ranges.',1),
  tq('A patient on high-dose opioids has very high dopamine activity. An option says "the opioid activates dopamine receptors in the NAc." What is the better explanation?',['μ-opioid activation inhibits GABA neurons that normally suppress dopamine cells, so dopamine neurons are disinhibited','Opioids block dopamine reuptake','Opioids block adenosine receptors','Opioids directly increase PFC activity'],'Disinhibition, not direct receptor activation.',1),
  tq('Which of the following are TRUE? I. Cocaine blocks dopamine reuptake. II. Caffeine blocks adenosine receptors. III. Gambling dopamine peaks at predictable rewards. IV. Drug-induced LTP strengthens cue synapses.',['I, II and IV','I and II','I, II and III','All of the above'],'III is false: dopamine fires most for unexpected or better-than-expected rewards.',1),
  tq('A recovering patient walks past the bar where they used to drink and feels an intense craving. Which best explains this?',['LTP during use strengthened cue (place) synapses along with the reward pathway','Their dopamine receptors increased','Their PFC got stronger','The amygdala stopped sending input'],'"Neurons that fire together, wire together."',1),
]);

<script>
const KEY='l13climb_v3';
const store = { get(){ try{ return JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){ return {}; } },
  set(v){ try{ localStorage.setItem(KEY, JSON.stringify(v)); }catch(e){} } };
let SAVE = Object.assign({stars:{}, miss:[], best:0, theme:null}, store.get());
if (SAVE.theme) document.documentElement.setAttribute('data-theme', SAVE.theme);
const ALL = STAGES.flatMap(s=>s.items);
const byId = Object.fromEntries(ALL.map(i=>[i.id,i]));
const app = document.getElementById('app');
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const starHTML = n => '<i>'+'★'.repeat(n)+'</i>'+'★'.repeat(3-n);

/* ---------- home ---------- */
function home(){
  // Hebbian network map: 7 neurons in a zigzag; a wire is drawn bold once the stage before it has 3 stars
  const P=[[40,130],[110,60],[180,140],[250,55],[320,135],[390,50],[465,110]];
  const faint = [[0,3],[1,4],[2,5],[3,6],[0,2],[2,4],[4,6],[1,3],[3,5]].map(([a,b])=>`<line class="faint" x1="${P[a][0]}" y1="${P[a][1]}" x2="${P[b][0]}" y2="${P[b][1]}"></line>`).join('');
  const curve = 'M'+P.map(p=>p.join(',')).join(' L');
  const wires = P.slice(1).map((p,i)=> (SAVE.stars[i]||0)===3 ? `<line class="wire" x1="${P[i][0]}" y1="${P[i][1]}" x2="${p[0]}" y2="${p[1]}"></line>` : '').join('');
  const dots = STAGES.map((s,i)=>{const [x,y]=P[i]; const done=(SAVE.stars[i]||0)===3; return `<g class="dot${done?' done':''}" data-stage="${i}" role="button" tabindex="0" aria-label="Stage ${i+1}: ${esc(s.name)}"><circle cx="${x}" cy="${y}" r="13"></circle><text x="${x}" y="${y}">${i+1}</text></g>`;}).join('');
  const missN = SAVE.miss.filter(id=>byId[id]).length;
  const trapN = ALL.filter(i=>i.trap).length;
  const hyN = ALL.filter(i=>i.hy).length;
  app.innerHTML = `
  <div class="top"><span class="eyebrow">A&amp;P · Lecture 13</span><button class="ghost" id="theme">${themeLabel()}</button></div>
  <div class="hero"><h1>Reward Circuit Climb</h1><p>Seven stages from the wiring diagram to addiction. Built around her trap questions: clinical scenarios, which-statements-are-true, and close-but-wrong options. Three-star a stage and its neuron wires to the next one.</p></div>
  <div class="trace" aria-label="Stage map drawn as a neural network">
    <svg viewBox="0 0 510 190" role="img">
      ${faint}<path class="curve" d="${curve}"></path>${wires}${dots}
      <text class="ax" x="14" y="180">Part 1: organization</text><text class="ax" x="190" y="180">Part 2: plasticity + LTP</text><text class="ax" x="380" y="180">Part 3: reward</text>
    </svg>
  </div>
  <div class="modes">
    <button class="mode" data-mode="hy"><b>High-Yield Run</b><span>${hyN} starred items, shuffled</span></button>
    <button class="mode" data-mode="miss" ${missN?'':'disabled'}><b>Your Misses</b><span>${missN?missN+' to clear':'Nothing missed yet'}</span></button>
    <button class="mode" data-mode="trap"><b>Trap Run</b><span>${trapN} trap and clicker questions</span></button>
    <button class="mode" data-mode="mix"><b>Mixed 20</b><span>20 random from every stage</span></button>
  </div>
  <div class="eyebrow" style="margin-bottom:8px">Stages · ${ALL.length} questions</div>
  <div class="stages">${STAGES.map((s,i)=>`<button class="stage" data-stage="${i}"><span class="mv">${s.mv}</span><span><h3>${i+1}. ${esc(s.name)}</h3><small>${esc(s.sub)} · ${s.items.length} Qs</small></span><span class="stars">${starHTML(SAVE.stars[i]||0)}</span></button>`).join('')}</div>
  <p class="foot">Stars count first-try accuracy: 90% for three, 75% for two, 50% for one. Anything you miss comes back at the end of the run until you get it, and lands in Your Misses.</p>`;
  app.querySelectorAll('[data-stage]').forEach(b=>{ const go=()=>startRun('stage',+b.dataset.stage); b.addEventListener('click',go); b.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();go();} }); });
  app.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>startRun(b.dataset.mode)));
  document.getElementById('theme').onclick = toggleTheme;
  // stages list top = last stage climbs upward visually? keep order 1..8 for reading.
}
function themeLabel(){ const t=document.documentElement.getAttribute('data-theme'); return t==='dark'?'Dark':t==='light'?'Light':'Auto'; }
function toggleTheme(){ const r=document.documentElement; const t=r.getAttribute('data-theme'); const n = t===null?'dark':t==='dark'?'light':null; if(n) r.setAttribute('data-theme',n); else r.removeAttribute('data-theme'); SAVE.theme=n; store.set(SAVE); document.getElementById('theme').textContent=themeLabel(); }

/* ---------- run ---------- */
let R=null;
function startRun(mode, stage){
  let items, title;
  if(mode==='stage'){ items = STAGES[stage].items.slice(); title = (stage+1)+'. '+STAGES[stage].name; }
  else if(mode==='hy'){ items = shuffle(ALL.filter(i=>i.hy)); title='High-Yield Run'; }
  else if(mode==='miss'){ items = shuffle(SAVE.miss.map(id=>byId[id]).filter(Boolean)); title='Your Misses'; }
  else if(mode==='trap'){ items = shuffle(ALL.filter(i=>i.trap)); title='Trap Run'; }
  else { items = shuffle(ALL).slice(0,20); title='Mixed 20'; }
  R = {mode, stage, title, queue: items.map(it=>({it, retry:false})), total: items.length, firstRight:0, firstDone:0, score:0, streak:0, missed:[], pos:0};
  renderItem();
}
function mult(){ return Math.min(4, 1+Math.floor(R.streak/3)); }
function hud(){
  const done = R.firstDone; const pct = Math.round(100*done/R.total);
  return `<div class="hud"><div class="hudrow"><button class="ghost" id="quit">← Map</button><span>${esc(R.title)}</span><span>${R.score} pts <span class="mult">×${mult()}</span></span></div>
  <div class="bar"><i style="width:${pct}%"></i></div><div class="hudrow"><span>${Math.min(done+1,R.total)} / ${R.total}${R.queue[R.pos]&&R.queue[R.pos].retry?' · retry':''}</span><span>streak ${R.streak}</span></div></div>`;
}
function figHTML(key, item){
  const d = DIA[key]; if(!d) return '';
  const mask = d.mask!==false;
  let boxes = '';
  if(item && (item.t==='lb'||item.t==='nm')){
    let tIdx = -1;
    if(item.t==='nm'){ let k=0; d.b.forEach((b,i)=>{ if(b[4]===item.name){ if(k===item.idx) tIdx=i; k++; } }); }
    boxes = d.b.map((b,i)=>{
      const cls = item.t==='lb' ? 'box tap' : (i===tIdx ? 'box target' : 'box');
      if(!mask && item.t==='nm' && i!==tIdx) return '';
      const tag = item.t==='lb' ? 'button' : 'div';
      return `<${tag} class="${cls}" data-bi="${i}" data-name="${esc(b[4])}" style="left:${b[0]}%;top:${b[1]}%;width:${b[2]}%;height:${b[3]}%" ${item.t==='lb'?'aria-label="covered label"':''}></${tag}>`;
    }).join('');
  }
  return `<div class="fig ${mask?'':'nomask'}"><img src="${d.img}" alt="${esc(d.title)}">${boxes}</div><div class="figcap">${esc(d.title)}</div>`;
}
function renderItem(){
  if(R.pos>=R.queue.length) return finish();
  const {it, retry} = R.queue[R.pos];
  const typeName = {mc:(it.trap?'Trap question':'Multiple choice'),so:'Sort',od:'Order',mt:'Match',lb:'Tap the label',nm:'Name the box'}[it.t];
  let body = '';
  const tag = `<div class="tag">${typeName}${it.hy?' <span class="hy">high yield</span>':''}${retry?' · second chance':''}</div>`;
  if(it.t==='mc'){
    const opts = shuffle(it.o);
    body = (it.ctx?`<div class="ctx">${esc(it.ctx)}</div>`:'') + (it.img?figHTML(it.img):'') + `<p class="q">${esc(it.q)}</p><div class="opts">${opts.map(o=>`<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
  } else if(it.t==='so'){
    const S = SORTS[it.set];
    body = `<p class="q">${esc(S.label)}</p><div class="sortitem">${esc(it.item)}</div><div class="cats">${S.cats.map(c=>`<button class="cat" data-key="${c[0]}" style="--cc:var(${c[2]})">${esc(c[1])}</button>`).join('')}</div>`;
  } else if(it.t==='od'){
    body = `<p class="q">${esc(it.q)}</p><div class="seq" id="seq"></div><div class="chips">${shuffle(it.steps).map(s=>`<button class="chip" data-v="${esc(s)}">${esc(s)}</button>`).join('')}</div><div class="actions"><button class="ghostbtn" id="undo">Undo</button></div>`;
  } else if(it.t==='mt'){
    body = `<p class="q">${esc(it.q)}</p><div class="mtgrid"><div class="mtcol">${it.pairs.map(p=>`<button class="mtb L" data-v="${esc(p[0])}">${esc(p[0])}</button>`).join('')}</div><div class="mtcol">${shuffle(it.pairs.map(p=>p[1])).map(v=>`<button class="mtb Rr" data-v="${esc(v)}">${esc(v)}</button>`).join('')}</div></div>`;
  } else if(it.t==='lb'){
    body = `<p class="q">Tap the covered label: <span style="color:var(--accent)">${esc(it.name)}</span></p>` + figHTML(it.dia,it);
  } else if(it.t==='nm'){
    const d=DIA[it.dia];
    let opts;
    if(it.o) opts = it.o.slice();
    else { const names=[...new Set(d.b.map(b=>b[4]))].filter(n=>n!==it.name); opts=[it.ans, ...shuffle(names).slice(0,3)]; }
    body = figHTML(it.dia,it) + `<p class="q">${esc(it.q||'Name the label in the orange box.')}</p><div class="opts">${shuffle(opts).map(o=>`<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
  }
  app.innerHTML = hud() + `<div class="card" id="card">${tag}${body}<div id="fb"></div></div>`;
  document.getElementById('quit').onclick = ()=>{ R=null; home(); };
  wire(it);
  window.scrollTo(0,0);
}
function wire(it){
  const card = document.getElementById('card');
  if(it.t==='mc' || it.t==='nm'){
    const right = it.t==='mc' ? it.o[0] : it.ans;
    card.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const ok = b.dataset.v===right;
      card.querySelectorAll('.opt').forEach(x=>{ x.disabled=true; if(x.dataset.v===right) x.classList.add('right'); });
      if(!ok) b.classList.add('wrong');
      if(it.t==='nm'){ const t=card.querySelector('.box.target'); if(t){ t.classList.add('right'); } }
      answer(ok, it.t==='nm' && !ok ? 'It was: '+it.ans : (ok?'':'Answer: '+right));
    });
  } else if(it.t==='so'){
    card.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{
      const ok = b.dataset.key===it.key;
      card.querySelectorAll('.cat').forEach(x=>{ x.disabled=true; if(x.dataset.key===it.key) x.classList.add('right'); });
      if(!ok) b.classList.add('wrong');
      const S=SORTS[it.set]; answer(ok, ok?'':'Answer: '+S.cats.find(c=>c[0]===it.key)[1]);
    });
  } else if(it.t==='lb'){
    card.querySelectorAll('.box.tap').forEach(b=>b.onclick=()=>{
      if(card.dataset.done) return; card.dataset.done=1;
      const ok = b.dataset.name===it.name;
      card.querySelectorAll('.box.tap').forEach(x=>{ x.disabled=true; if(x.dataset.name===it.name) x.classList.add('right'); });
      if(!ok) b.classList.add('wrong');
      answer(ok, ok?'':'The green outline shows where it is.');
    });
  } else if(it.t==='od'){
    const seq=[]; const seqEl=document.getElementById('seq');
    const draw=()=>{ seqEl.innerHTML = seq.map((s,i)=>`<div class="slot"><span>${i+1}</span><span>${esc(s)}</span></div>`).join(''); };
    card.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
      seq.push(b.dataset.v); b.disabled=true; draw();
      if(seq.length===it.steps.length){
        const ok = seq.every((s,i)=>s===it.steps[i]);
        seqEl.querySelectorAll('.slot').forEach((el,i)=>{ if(seq[i]!==it.steps[i]) el.classList.add('wrong'); });
        document.getElementById('undo').disabled=true;
        answer(ok, ok?'':'Correct order: '+it.steps.map((s,i)=>(i+1)+') '+s).join('  '));
      }
    });
    document.getElementById('undo').onclick=()=>{ const v=seq.pop(); if(v==null) return; const c=[...card.querySelectorAll('.chip')].find(x=>x.dataset.v===v&&x.disabled); if(c) c.disabled=false; draw(); };
  } else if(it.t==='mt'){
    let selL=null; const made={};
    const L=[...card.querySelectorAll('.mtb.L')], Rr=[...card.querySelectorAll('.mtb.Rr')];
    L.forEach(b=>b.onclick=()=>{ if(b.classList.contains('paired')) return; L.forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); selL=b; });
    Rr.forEach(b=>b.onclick=()=>{
      if(!selL || b.classList.contains('paired')) return;
      made[selL.dataset.v]=b.dataset.v; selL.classList.remove('sel'); selL.classList.add('paired'); b.classList.add('paired');
      selL.textContent = selL.dataset.v+' → '+b.dataset.v; selL=null;
      if(Object.keys(made).length===it.pairs.length){
        const ok = it.pairs.every(p=>made[p[0]]===p[1]);
        L.forEach(x=>{ const p=it.pairs.find(p=>p[0]===x.dataset.v); x.classList.add(made[p[0]]===p[1]?'right':'wrong'); });
        answer(ok, ok?'':'Pairs: '+it.pairs.map(p=>p[0]+' → '+p[1]).join(' · '));
      }
    });
  }
}
function answer(ok, extra){
  const q = R.queue[R.pos];
  if(!q.retry){
    R.firstDone++;
    if(ok){ R.firstRight++; }
    else { R.missed.push(q.it.id); if(!SAVE.miss.includes(q.it.id)) SAVE.miss.push(q.it.id); }
  }
  if(ok){ R.score += 10*mult(); R.streak++; if(R.mode==='miss'||q.retry) SAVE.miss = SAVE.miss.filter(id=>id!==q.it.id); }
  else { R.streak=0; R.queue.push({it:q.it, retry:true}); }
  store.set(SAVE);
  const fb = document.getElementById('fb');
  fb.innerHTML = `<div class="fb ${ok?'ok':'no'}"><b>${ok?'Correct':'Not quite'}</b>${extra?esc(extra)+'<br>':''}${esc(q.it.why||'')}</div><button class="next" id="next">${R.pos+1<R.queue.length?'Next':'See results'}</button>`;
  const n=document.getElementById('next'); n.onclick=()=>{ R.pos++; renderItem(); }; n.focus({preventScroll:true});
  fb.scrollIntoView({block:'nearest',behavior:'smooth'});
}
function finish(){
  const acc = R.total? R.firstRight/R.total : 0;
  const st = acc>=0.9?3:acc>=0.75?2:acc>=0.5?1:0;
  if(R.mode==='stage'){ SAVE.stars[R.stage]=Math.max(SAVE.stars[R.stage]||0, st); }
  SAVE.best=Math.max(SAVE.best||0,R.score); store.set(SAVE);
  const missed=[...new Set(R.missed)].map(id=>byId[id]);
  const label = it => it.t==='so'?it.item : (it.t==='lb'||it.t==='nm')? (it.q||'Label')+': '+it.ans : it.q;
  app.innerHTML = `<div class="card result" style="margin-top:18px"><div class="eyebrow">${esc(R.title)}</div><h2>${st===3?'Summit':st===2?'Almost there':st===1?'Halfway up':'Keep climbing'}</h2>
    <div class="big-stars">${starHTML(st)}</div>
    <p class="stat">${R.firstRight}/${R.total} first try (${Math.round(acc*100)}%) · ${R.score} pts · best ${SAVE.best}</p>
    ${missed.length?`<div class="eyebrow" style="margin-top:12px">Missed on first try</div><ul class="misslist">${missed.map(it=>`<li>${esc(label(it))}</li>`).join('')}</ul>`:''}
    <div class="actions" style="margin-top:16px"><button class="next" id="again">Run it again</button><button class="ghostbtn" id="map">Back to map</button></div></div>`;
  document.getElementById('again').onclick=()=>startRun(R.mode,R.stage);
  document.getElementById('map').onclick=()=>{ R=null; home(); };
}
window.L13 = { cur: ()=> R && R.queue[R.pos] ? R.queue[R.pos].it : null, STAGES, DIA, SORTS, startRun, home };
home();
</script>

</body></html>
